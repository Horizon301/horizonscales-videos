<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>8:47 PM — Horizon Scales (test)</title>
<style>
  @font-face { font-family: "Space Grotesk"; src: url(fonts/SpaceGrotesk-700.woff2) format("woff2"); font-weight: 700; }

</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { DUR, T, CAPS, RINGS, BUZZ, DRIPS, HITS } from './timeline.js';
import { seg, ease as E, spring, stageSize, setupCanvas, loadFonts, loadImage, rng, lerp, clamp, TAU, mix } from './motion.js';

const { W: SW_, H: SH_ } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), SW_, SH_);
const SC = SW_ / 1080;
const MODE = new URLSearchParams(location.search).get('dir');
const C = { plum: 'rgb(28,2,40)', coral: '#F0645A', coralLite: '#F5A39A', cream: '#F6F0E6', sun: '#FFD27A' };
const NAVY = '#10152E', WALL = '#1D2750', FLOOR = '#0C1024', AMBER = '#FFB84D', MINT = '#5FD6B4', RED = '#F0645A', INK = '#0B0E1F', SKIN = '#F0BFA3', SKIN2 = '#D9A184';
const sp = (x, o) => (x <= 0 ? 0 : spring(x, o));
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); };
const txt = (s, x, y, font, fill, ls = 0, align = 'center') => { ctx.font = font; ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.letterSpacing = '0px'; };
const inAny = (t, wins) => wins.some(([a, b]) => t >= a && t < b);

// frame safety: hook panel y 180–400; scene y 430–1230 (words, faces and phones inside x 140–940);
// captions centred x 500 around y 1340, max 660 wide; nothing that matters right of x 864 below y 920 or under y 1630.

// soft film grain, seeded so every frame is the same
const TEX = document.createElement('canvas'); TEX.width = 540; TEX.height = 960;
{ const g = TEX.getContext('2d'), r = rng(11);
  for (let i = 0; i < 5200; i++) { g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '0,0,0'},${0.03 + r() * 0.05})`; g.fillRect(r() * 540, r() * 960, 1 + r() * 2, 1 + r() * 2); } }
const grain = () => { ctx.drawImage(TEX, 0, 0, 1080, 1920); };

// ───────────────────────── night: her utility room
const clockText = t => (t < T.s3 + 0.9 ? '8:47' : t < T.s4 ? '8:48' : t < T.pick + 0.6 ? '8:51' : t < T.s5 + 0.5 ? '8:54' : '8:58');
function wallClock(x, y, label, ampm, tChange, t, glow = AMBER) {
  const pop = 1 + 0.08 * Math.exp(-Math.max(0, t - tChange) * 9) * (t >= tChange ? 1 : 0);
  ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
  rr(-150, -58, 300, 116, 22); ctx.fillStyle = INK; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.stroke();
  ctx.shadowColor = glow; ctx.shadowBlur = 22;
  txt(label, -28, 28, '700 84px "Space Grotesk"', glow, 2);
  ctx.shadowBlur = 0;
  txt(ampm, 106, 26, '700 34px "Space Grotesk"', glow, 1);
  ctx.restore();
}
function clockChanges(t) { let c = 0; for (const k of [T.s3 + 0.9, T.s4, T.pick + 0.6, T.s5 + 0.5]) if (t >= k) c = k; return c; }

function roomNight(t) {
  ctx.fillStyle = WALL; ctx.fillRect(-200, -200, 1480, 1340);
  // wall boards
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 3; for (let x = -180; x < 1280; x += 120) { ctx.beginPath(); ctx.moveTo(x, 420); ctx.lineTo(x, 1140); ctx.stroke(); }
  // ceiling lamp + warm cone
  const flick = 1 - 0.05 * Math.sin(t * 9) * Math.sin(t * 2.3);
  const g = ctx.createRadialGradient(560, 430, 10, 560, 760, 720); g.addColorStop(0, `rgba(255,184,77,${0.34 * flick})`); g.addColorStop(1, 'rgba(255,184,77,0)'); ctx.fillStyle = g; ctx.fillRect(0, 400, 1080, 900);
  ctx.fillStyle = FLOOR; ctx.fillRect(-200, 1140, 1480, 980);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, 1140, 1080, 6);
}
function heater(t) {
  const X = 250, TOP = 600, BOT = 1120;
  // pipes
  ctx.strokeStyle = '#8D6A4B'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X - 46, TOP); ctx.lineTo(X - 46, 430); ctx.moveTo(X + 46, TOP); ctx.lineTo(X + 46, 430); ctx.stroke(); ctx.lineCap = 'butt';
  // tank
  rr(X - 108, TOP, 216, BOT - TOP, 34); ctx.fillStyle = '#C7CCD9'; ctx.fill();
  ctx.save(); rr(X - 108, TOP, 216, BOT - TOP, 34); ctx.clip();
  ctx.fillStyle = 'rgba(16,21,46,.28)'; ctx.fillRect(X + 30, TOP, 90, BOT - TOP);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(X - 86, TOP, 18, BOT - TOP);
  ctx.fillStyle = '#9AA1B4'; ctx.fillRect(X - 108, TOP + 96, 216, 10); ctx.fillRect(X - 108, BOT - 110, 216, 10);
  ctx.restore();
  // control box: the light goes red and blinks
  rr(X - 58, TOP + 150, 116, 150, 12); ctx.fillStyle = '#2A3050'; ctx.fill();
  txt('HOT WATER', X, TOP + 186, '700 15px "Space Grotesk"', '#AEB6CF', 1.5);
  const blink = 0.45 + 0.55 * (Math.sin(t * 7) > 0 ? 1 : 0.15);
  ctx.shadowColor = RED; ctx.shadowBlur = 26 * blink; circ(X, TOP + 232, 20); ctx.fillStyle = `rgba(240,100,90,${blink})`; ctx.fill(); ctx.shadowBlur = 0;
  txt('ERROR', X, TOP + 284, '500 18px "DM Mono"', RED, 1);
  // valve + drips + puddle
  ctx.fillStyle = '#8D6A4B'; rr(X - 20, BOT - 6, 40, 22, 5); ctx.fill();
  const grow = E.outCubic(seg(t, 0, T.s6));
  const pw = lerp(110, 300, grow);
  ctx.beginPath(); ctx.ellipse(X + 30, 1168, pw, 26 + 10 * grow, 0, 0, TAU); ctx.fillStyle = 'rgba(120,190,230,.42)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(X + 10, 1164, pw * 0.5, 9, 0, 0, TAU); ctx.fillStyle = 'rgba(210,235,250,.35)'; ctx.fill();
  for (const k of DRIPS) {
    const f = t - (k - 0.3); if (f < 0 || f > 0.8) continue;
    if (f < 0.3) { const y = BOT + 18 + 30 * (f / 0.3) ** 2; ctx.beginPath(); ctx.ellipse(X, y, 6, 10, 0, 0, TAU); ctx.fillStyle = '#A9D8F2'; ctx.fill(); }
    else { const q = (f - 0.3) / 0.5; ctx.strokeStyle = `rgba(200,232,250,${0.8 * (1 - q)})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(X, 1166, 20 + 90 * q, 6 + 16 * q, 0, 0, TAU); ctx.stroke(); }
  }
  // cold shower hint: a little steam that's gone → faint "no hot water" wisps would be a wrapper; leave it out
}

// moods: 0 worried, 1 annoyed, 2 set, 3 happy
function mood(t) { return t < T.closed ? 0 : t < T.s3 ? 1 : t < T.pick ? 2 : 3; }
function woman(t) {
  const m = mood(t), calling = (t >= T.s2 && t < T.closed + 0.5) || (t >= T.s4 && t < T.s5 + 0.3);
  const up = E.inOutCubic(Math.max(seg(t, T.s2, T.s2 + 0.3) * (1 - seg(t, T.closed + 0.5, T.closed + 0.8)), seg(t, T.s4, T.s4 + 0.3) * (1 - seg(t, T.s5 + 0.3, T.s5 + 0.6))));
  const happy = E.outCubic(seg(t, T.pick, T.pick + 0.3));
  const breathe = Math.sin(t * 2.4) * 3, slump = m === 1 ? 10 : 0;
  const X = 470, FL = 1136;
  ctx.save(); ctx.translate(X + 3 * Math.sin(t * 1.1), 0);
  // shadow
  ctx.beginPath(); ctx.ellipse(0, FL + 4, 96, 14, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  // slippers + legs
  ctx.fillStyle = SKIN2; rr(-40, 1060, 26, 70, 10); ctx.fill(); rr(14, 1060, 26, 70, 10); ctx.fill();
  ctx.fillStyle = '#F6E3C8'; rr(-52, 1112, 46, 24, 12); ctx.fill(); rr(8, 1112, 46, 24, 12); ctx.fill();
  // robe (brand coral) with a lighter belt and collar
  const sh = 846 + slump + breathe * 0.4;
  ctx.beginPath(); ctx.moveTo(-64, sh); ctx.quadraticCurveTo(0, sh - 26, 64, sh); ctx.lineTo(84, 1082); ctx.quadraticCurveTo(0, 1100, -84, 1082); ctx.closePath(); ctx.fillStyle = C.coral; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-18, sh - 8); ctx.lineTo(4, 960); ctx.lineTo(22, sh - 8); ctx.closePath(); ctx.fillStyle = '#F6E3C8'; ctx.fill();
  ctx.fillStyle = '#C9453C'; ctx.fillRect(-76, 962, 152, 16);
  // left arm (screen side): hangs, pumps a little when someone answers
  const pump = happy * (1 - seg(t, T.pick + 1.1, T.pick + 1.5)) * (0.5 + 0.5 * Math.sin(t * 15));
  ctx.strokeStyle = C.coral; ctx.lineWidth = 30; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-58, sh + 14); ctx.lineTo(-88, 950 - pump * 30); ctx.lineTo(-70 + pump * 10, 1010 - pump * 130); ctx.stroke();
  circ(-70 + pump * 10, 1016 - pump * 136, 17); ctx.fillStyle = SKIN; ctx.fill();
  // right arm with the phone: in front of her (looking at it) ↔ up at her ear
  const hx = lerp(96, 62, up), hy = lerp(900, 772, up), ex = lerp(92, 104, up), ey = lerp(960, 890, up);
  ctx.strokeStyle = C.coral; ctx.beginPath(); ctx.moveTo(58, sh + 14); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke(); ctx.lineCap = 'butt';
  // head
  const hY = 772 + slump * 0.6 + breathe * 0.3, tilt = lerp(0.1, 0.02, up) + (m === 1 ? -0.07 : 0) - happy * 0.04;
  ctx.save(); ctx.translate(0, hY); ctx.rotate(tilt);
  circ(-6, -62, 30); ctx.fillStyle = '#3A2420'; ctx.fill();                                  // bun
  circ(0, 0, 60); ctx.fillStyle = '#3A2420'; ctx.fill();                                     // hair
  circ(4, 6, 54); ctx.fillStyle = SKIN; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-52, -6); ctx.quadraticCurveTo(-30, -62, 30, -50); ctx.quadraticCurveTo(58, -40, 58, -8); ctx.quadraticCurveTo(20, -34, -52, -6); ctx.fillStyle = '#3A2420'; ctx.fill();
  // face
  const look = lerp(8, 0, up);
  ctx.fillStyle = INK; circ(-12 + look, 8, 6); ctx.fill(); circ(26 + look, 8, 6); ctx.fill();
  ctx.lineWidth = 4.5; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  const bw = m === 0 ? 0.3 : m === 1 ? -0.35 : m === 2 ? -0.15 : 0.12;
  ctx.beginPath(); ctx.moveTo(-26 + look, -10 - bw * 18); ctx.lineTo(-2 + look, -12 + bw * 18); ctx.moveTo(16 + look, -12 + bw * 18); ctx.lineTo(40 + look, -10 - bw * 18); ctx.stroke();
  ctx.beginPath();
  if (m === 3) ctx.arc(8 + look, 24, 15, 0.15, Math.PI - 0.15); else if (m === 0) ctx.arc(8 + look, 42, 12, Math.PI + 0.5, -0.5); else if (m === 1) { ctx.moveTo(-4 + look, 36); ctx.lineTo(20 + look, 30); } else { ctx.moveTo(-4 + look, 32); ctx.lineTo(20 + look, 32); }
  ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = 'rgba(240,100,90,.3)'; circ(-26, 26, 9); ctx.fill(); circ(42, 26, 9); ctx.fill();
  ctx.restore();
  // phone in her hand, with a soft screen glow on her face when she looks at it
  ctx.save(); ctx.translate(hx, hy - 6); ctx.rotate(lerp(-0.25, 0.25, up));
  rr(-16, -32, 32, 62, 7); ctx.fillStyle = '#0B0E1F'; ctx.fill(); rr(-12, -27, 24, 50, 4); ctx.fillStyle = m === 3 ? MINT : '#BFD7FF'; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();
  circ(hx, hy, 15); ctx.fillStyle = SKIN; ctx.fill();
  ctx.restore();
  // ring arcs at her ear while it rings
  if (inAny(t, RINGS)) { const ph = (t * 5) % 1; ctx.strokeStyle = AMBER; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { ctx.globalAlpha = 1 - (i + ph) / 3.2; ctx.beginPath(); ctx.arc(X + 64, 770, 44 + i * 18 + ph * 10, -0.8, 0.6); ctx.stroke(); } ctx.globalAlpha = 1; ctx.lineCap = 'butt'; }
}

// ───────────────────────── the big phone screen (what she sees and hears)
function bigPhone(x, y, k, rot, draw, glow) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 50; }
  rr(-140, -236, 280, 472, 40); ctx.fillStyle = '#070914'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.stroke();
  ctx.save(); rr(-126, -222, 252, 444, 28); ctx.clip(); draw(); ctx.restore();
  rr(-34, -214, 68, 16, 8); ctx.fillStyle = '#070914'; ctx.fill();
  ctx.restore();
}
function avatar(y, col) { circ(0, y, 46); ctx.fillStyle = col; ctx.fill(); circ(0, y - 10, 15); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill(); ctx.beginPath(); ctx.arc(0, y + 36, 28, Math.PI, 0); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill(); }
function moon(x, y, r, col, bg) { circ(x, y, r); ctx.fillStyle = col; ctx.fill(); circ(x + r * 0.42, y - r * 0.3, r * 0.86); ctx.fillStyle = bg; ctx.fill(); }
function check(x, y, s, col, k = 1) { ctx.strokeStyle = col; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); const a = Math.min(1, k * 2), b = Math.max(0, k * 2 - 1); ctx.lineTo(x - s * 0.5 + s * 0.35 * a, y + s * 0.35 * a); if (b > 0) ctx.lineTo(x - s * 0.15 + s * 0.7 * b, y + s * 0.35 - s * 0.8 * b); ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; }

function callScreen(t) {
  if (t < T.s2 - 0.1 || t >= T.s6) return;
  const second = t >= T.s4 - 0.05;
  const tIn = second ? T.s4 : T.s2, inK = Math.min(1.05, sp(t - tIn + 0.02, { freq: 3, damp: 0.72 }));
  const outK = !second ? E.inCubic(seg(t, T.s4 - 0.4, T.s4 - 0.05)) : 0;
  const x = lerp(1240, 750, Math.min(1, inK)) + 460 * outK, y = 764 + 6 * Math.sin(t * 1.4);
  const closed = !second && t >= T.closed, picked = second && t >= T.pick, booked = t >= T.s5;
  const shake = closed ? Math.sin((t - T.closed) * 60) * 10 * Math.exp(-(t - T.closed) * 9) : 0;
  const glow = booked || picked ? MINT : closed ? RED : null;
  bigPhone(x + shake, y, 1, -0.03 + 0.012 * Math.sin(t * 1.2), () => {
    ctx.fillStyle = booked ? '#0E3B34' : picked ? '#0F4A40' : closed ? '#2A1420' : '#141A38'; ctx.fillRect(-140, -240, 280, 480);
    if (booked) {
      const q = E.outCubic(seg(t, T.s5, T.s5 + 0.35));
      circ(0, -92, 62 * q); ctx.fillStyle = MINT; ctx.fill(); check(-2, -98, 62, '#0E3B34', seg(t, T.s5 + 0.15, T.s5 + 0.5));
      txt('BOOKED', 0, 22, '700 46px "Space Grotesk"', '#FFFFFF', 3);
      txt('Tomorrow', 0, 82, '400 44px "Instrument Serif"', MINT); ctx.font = 'italic 400 44px "Instrument Serif"';
      rr(-96, 110, 192, 62, 31); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
      txt('8:00 AM', 0, 153, '700 34px "Space Grotesk"', '#FFFFFF', 1);
      return;
    }
    txt(closed ? 'CALL ENDED' : picked ? 'CONNECTED' : 'CALLING…', 0, -150, '700 22px "Space Grotesk"', closed ? RED : picked ? MINT : '#9FB0E8', 3);
    avatar(-70, closed ? '#5B3140' : picked ? '#1F8F78' : '#3B4A8C');
    txt(second ? 'Plumber #2' : 'Plumber #1', 0, 36, '700 38px "Space Grotesk"', '#FFFFFF');
    if (closed) {
      const q = Math.min(1, sp(t - T.closed, { freq: 3.4, damp: 0.6 }));
      ctx.save(); ctx.translate(0, 120); ctx.scale(q, q);
      rr(-108, -52, 216, 104, 20); ctx.fillStyle = RED; ctx.fill();
      moon(-66, -8, 20, '#FFFFFF', RED);
      txt('CLOSED', 22, 0, '700 36px "Space Grotesk"', '#FFFFFF', 2);
      txt('Opens 8:00 AM', 0, 36, '500 20px "DM Mono"', '#FFE4E0');
      ctx.restore();
    } else if (picked) {
      const q = Math.min(1.06, sp(t - T.pick, { freq: 3.4, damp: 0.6 }));
      ctx.save(); ctx.translate(0, 124); ctx.scale(q, q);
      rr(-112, -54, 224, 108, 26); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-60, -52); ctx.lineTo(-44, -76); ctx.lineTo(-28, -52); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      txt('“Hi! How can', 0, -6, '700 30px "Space Grotesk"', '#0F4A40'); txt('we help?”', 0, 32, '700 30px "Space Grotesk"', '#0F4A40');
      ctx.restore();
    } else {
      const ph = (t * 1.6) % 1; for (let i = 0; i < 3; i++) { circ(-34 + i * 34, 112, 9); ctx.fillStyle = `rgba(159,176,232,${0.3 + 0.7 * Math.max(0, 1 - Math.abs(ph * 3 - i))})`; ctx.fill(); }
      circ(0, 178, 30); ctx.fillStyle = RED; ctx.fill(); ctx.fillStyle = '#fff'; rr(-15, 173, 30, 10, 5); ctx.fill();
    }
  }, glow);
}

// ───────────────────────── plumber #1's shop: morning (d = 1) and night (d = 0)
function shop(t, d) {
  const sky = ctx.createLinearGradient(0, 400, 0, 1140); sky.addColorStop(0, mix('#0B1030', '#FFC98A', d)); sky.addColorStop(1, mix('#1A2452', '#FFE9C4', d)); ctx.fillStyle = sky; ctx.fillRect(-200, -200, 1480, 1340);
  if (d > 0.5) { const sy = lerp(900, 560, E.outCubic(seg(t, T.s6, T.s6 + 1.2)));
    const g = ctx.createRadialGradient(840, sy, 10, 840, sy, 420); g.addColorStop(0, 'rgba(255,240,190,.95)'); g.addColorStop(1, 'rgba(255,240,190,0)'); ctx.fillStyle = g; ctx.fillRect(400, 300, 700, 900);
    circ(840, sy, 62); ctx.fillStyle = '#FFF3C4'; ctx.fill(); }
  else { moon(850, 540, 46, '#F4EBD0', '#0F1638'); ctx.fillStyle = 'rgba(244,235,208,.7)'; for (const [x, y, r] of [[200, 470, 3], [420, 520, 2.5], [640, 450, 3], [960, 660, 2.5], [120, 600, 2.5], [730, 600, 2]]) { circ(x, y, r + 0.8 * Math.sin(t * 3 + x)); ctx.fill(); } }
  // building
  ctx.fillStyle = mix('#232C58', '#F3E2C2', d); ctx.fillRect(110, 640, 800, 500);
  ctx.fillStyle = mix('#161C40', '#C9573F', d); ctx.fillRect(90, 600, 840, 56); txt('PLUMBING', 430, 642, '700 38px "Space Grotesk"', mix('#4A578F', '#FFF4DC', d), 8);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? mix('#1B2248', '#F6EBD6', d) : mix('#141A3C', '#C9573F', d); ctx.beginPath(); ctx.moveTo(90 + i * 70, 656); ctx.lineTo(160 + i * 70, 656); ctx.lineTo(150 + i * 70, 706); ctx.lineTo(100 + i * 70, 706); ctx.closePath(); ctx.fill(); }
  // window with the counter and his phone on it
  rr(420, 760, 440, 300, 10); ctx.fillStyle = mix('#0A0E24', '#BFE3EE', d); ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = mix('#2E386A', '#FFFFFF', d); ctx.stroke();
  ctx.fillStyle = mix('#151B40', '#8C6B4E', d); ctx.fillRect(430, 990, 420, 64);
  // door + hanging sign
  rr(170, 760, 190, 380, 8); ctx.fillStyle = mix('#131939', '#2F6F8C', d); ctx.fill(); rr(196, 790, 138, 170, 6); ctx.fillStyle = mix('#0A0E24', '#CDEAF2', d); ctx.fill();
  circ(338, 968, 8); ctx.fillStyle = AMBER; ctx.fill();
  const flip = d > 0.5 ? E.inOutCubic(seg(t, T.open, T.open + 0.4)) : 0, sx = Math.cos(flip * Math.PI), open = flip > 0.5;
  ctx.strokeStyle = mix('#59649B', '#5B4636', d); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(240, 800); ctx.lineTo(265, 826); ctx.lineTo(290, 800); ctx.stroke();
  ctx.save(); ctx.translate(265, 868); ctx.rotate(0.04 * Math.sin(t * 2.2)); ctx.scale(Math.max(0.04, Math.abs(sx)), 1);
  rr(-60, -40, 120, 80, 10); ctx.fillStyle = open ? '#2FA37F' : RED; ctx.fill();
  txt(open ? 'OPEN' : 'CLOSED', 0, 12, `700 ${open ? 34 : 26}px "Space Grotesk"`, '#FFFFFF', 1.5);
  ctx.restore();
  // ground
  ctx.fillStyle = mix('#090C1F', '#D8C3A0', d); ctx.fillRect(-200, 1140, 1480, 980);
  ctx.fillStyle = mix('#0E1330', '#C4AE8A', d); ctx.fillRect(-200, 1140, 1480, 10);
}
function shopClock(t, d) {}

function plumber(t) {
  const walk = E.outCubic(seg(t, T.s6, T.s6 + 0.9)), X = lerp(-140, 480, walk), step = walk < 1 ? Math.sin(t * 16) : 0;

// ───────────────────────── camera, overlays
function cam(t) {
  let z = 1.2, fx = 575, fy = 840;
  const starts = [T.s1, T.s2, T.s3, T.s4, T.s5, T.s6, T.s7, T.s8, T.end]; let a = 0, b = T.end;
  for (let i = 0; i < starts.length - 1; i++) if (t >= starts[i]) { a = starts[i]; b = starts[i + 1]; }
  z += 0.05 * seg(t, a, b);                                             // slow push-in through every scene
  if (t < T.s2) { const k = 1 - E.outCubic(seg(t, 0, 1.3)); z += 0.3 * k; fx = lerp(575, 400, k); fy = lerp(840, 760, k); }   // opens tight on the clock and the red light
  if (t >= T.s8) { const k = E.inOutCubic(seg(t, T.s8, T.s8 + 2.2)); z += 0.04 * k; fx = lerp(575, 560, k); fy = lerp(840, 860, k); }
