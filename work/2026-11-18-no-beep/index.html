<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No Beep — Horizon Scales</title>
<style>
  @font-face { font-family: "Righteous"; src: url(fonts/Righteous.woff2) format("woff2"); }
  @font-face { font-family: "Outfit"; src: url(fonts/Outfit-500.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Outfit"; src: url(fonts/Outfit-700.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: "Poppins"; src: url(fonts/Poppins-600.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "Young Serif"; src: url(fonts/YoungSerif.woff2) format("woff2"); }
  @font-face { font-family: "Nunito"; src: url(fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; background: #160A2A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { DUR, T, CAPS, HITS, LYRICS, RING, DRIPS } from './timeline.js';
import { seg, ease as E, spring, stageSize, setupCanvas, loadFonts, loadImage, rng, hash, lerp, clamp, TAU } from './motion.js';

const { W: SW_, H: SH_ } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), SW_, SH_);
const SC = SW_ / 1080;
const MODE = new URLSearchParams(location.search).get('dir');
const C = { plum: 'rgb(28,2,40)', coral: '#F0645A', coralLite: '#F5A39A', cream: '#F6F0E6', sun: '#FFD27A' };
// Karaoke-night look: a small lounge (velvet plum wall, a sparkly tinsel curtain, two sweeping stage lights) and a big
// karaoke TV with the classic blue screen: white lyric lines that fill with sun yellow as they're "sung", a bouncing coral
// ball, scan lines. The voicemail greeting is the song. Righteous (karaoke lettering) + Outfit (captions and phone UI).
const SCR1 = '#2340B8', SCR2 = '#0C1452', WHITE = '#FFFFFF', INK = '#1A0F2E', RED = '#E5484D', GREEN = '#3FBF7F';
const sp = (x, o) => (x <= 0 ? 0 : spring(x, o));

// frame safety (Kai, Nov 5): hook block y 172–412 (x 140–940); the TV x 150–850, y 470–1170 (left of x 864 below y 920);
// captions centred at x 500 around y 1340 (≤ 640 wide); nothing that matters right of x 864 below y 920 or under y 1630.
// Curtain, lights and the stage floor are background only.

const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); };
function fitFont(text, weightFam, size, maxW) { ctx.font = `${weightFam.replace('#', size + 'px')}`; const w = ctx.measureText(text).width; if (w > maxW) { size = Math.floor(size * maxW / w); ctx.font = weightFam.replace('#', size + 'px'); } return size; }

// ── the lounge: velvet wall, tinsel curtain, sweeping lights, stage floor
const CURT = document.createElement('canvas'); CURT.width = 1080; CURT.height = 1920;
{ const g = CURT.getContext('2d'), r = rng(5);
  const grd = g.createLinearGradient(0, 0, 0, 1920); grd.addColorStop(0, '#2A0C45'); grd.addColorStop(0.6, '#1C0834'); grd.addColorStop(1, '#12061F');
  g.fillStyle = grd; g.fillRect(0, 0, 1080, 1920);
  for (let x = 0; x < 1080; x += 9) { g.strokeStyle = `rgba(${r() < 0.5 ? '240,100,90' : '180,120,255'},${0.06 + r() * 0.08})`; g.lineWidth = 3; g.beginPath(); g.moveTo(x + r() * 4, 0); g.lineTo(x + r() * 6, 1560); g.stroke(); } }
const SPARK = Array.from({ length: 160 }, (_, i) => [hash(i, 1) * 1080, hash(i, 2) * 1520, hash(i, 3)]);
function lounge(t) {
  ctx.drawImage(CURT, 0, 0);
  // tinsel sparkles twinkle (deterministic in t)
  for (const [x, y, p] of SPARK) { const a = Math.max(0, Math.sin(t * (2 + p * 3) + p * 40)) ** 6; if (a < 0.05) continue;
    ctx.fillStyle = `rgba(255,236,190,${0.75 * a})`; const s = 2 + 5 * a; ctx.fillRect(x - s / 2, y - 0.8, s, 1.6); ctx.fillRect(x - 0.8, y - s / 2, 1.6, s); }
  // two stage lights sweep (background)
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  [[120, 0.5, 0], [960, -0.45, 2]].forEach(([x, base, ph], i) => { const a = base + 0.28 * Math.sin(t * 0.9 + ph);
    ctx.save(); ctx.translate(x, -40); ctx.rotate(a);
    const g = ctx.createLinearGradient(0, 0, 0, 1700); g.addColorStop(0, i ? 'rgba(255,210,122,.20)' : 'rgba(240,100,90,.20)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.lineTo(260, 1700); ctx.lineTo(-260, 1700); ctx.closePath(); ctx.fill(); ctx.restore(); });
  ctx.restore();
  // stage floor
  const fy = 1560; const g = ctx.createLinearGradient(0, fy, 0, 1920); g.addColorStop(0, '#3B1A2E'); g.addColorStop(1, '#170A14');
  ctx.fillStyle = g; ctx.fillRect(0, fy, 1080, 360);
  ctx.strokeStyle = 'rgba(255,210,122,.18)'; ctx.lineWidth = 2; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(540 + (i - 4) * 60, fy); ctx.lineTo(540 + (i - 4) * 260, 1920); ctx.stroke(); }
  ctx.fillStyle = 'rgba(240,100,90,.55)'; ctx.fillRect(0, fy - 4, 1080, 6);
}

// ── the karaoke TV
const TV = [150, 470, 700, 700];                // outer bezel x, y, w, h
const SX = 182, SY = 502, SWd = 636, SHt = 600;  // the screen
const SCAN = document.createElement('canvas'); SCAN.width = SWd; SCAN.height = SHt;
{ const g = SCAN.getContext('2d'); for (let y = 0; y < SHt; y += 4) { g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(0, y, SWd, 2); } }
function tvFrame(t) {
  rr(TV[0] + 14, TV[1] + 18, TV[2], TV[3], 46); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fill();
  rr(TV[0], TV[1], TV[2], TV[3], 46); const g = ctx.createLinearGradient(0, TV[1], 0, TV[1] + TV[3]); g.addColorStop(0, '#3A3346'); g.addColorStop(1, '#1D1826'); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 3; ctx.stroke();
  // little label + power light on the bezel
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '700 18px "Outfit"'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '5px'; ctx.fillText('SING-ALONG', TV[0] + 34, TV[1] + TV[3] - 16); ctx.letterSpacing = '0px';
  circ(TV[0] + TV[2] - 40, TV[1] + TV[3] - 16, 6); ctx.fillStyle = (Math.floor(t * 2) % 2) ? C.coral : '#7A2E2A'; ctx.fill();
}
function screenBg(t, col1 = SCR1, col2 = SCR2) {
  const g = ctx.createLinearGradient(0, SY, 0, SY + SHt); g.addColorStop(0, col1); g.addColorStop(1, col2); ctx.fillStyle = g; ctx.fillRect(SX, SY, SWd, SHt);
  // soft moving light blobs behind the lyrics (classic karaoke backdrop)
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) { const x = SX + SWd * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.5 + i * 1.7))), y = SY + SHt * (0.25 + 0.5 * (0.5 + 0.5 * Math.cos(t * 0.37 + i * 2.3)));
    const r = 160 + 40 * i, gg = ctx.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, i % 2 ? 'rgba(240,100,90,.18)' : 'rgba(140,170,255,.16)'); gg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gg; ctx.fillRect(SX, SY, SWd, SHt); }
  ctx.restore();
}

// ── screen states
function phoneIcon(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(-26, -30); ctx.quadraticCurveTo(-34, -22, -30, -8); ctx.quadraticCurveTo(-14, 22, 10, 32); ctx.quadraticCurveTo(24, 36, 30, 26);
  ctx.lineTo(20, 12); ctx.quadraticCurveTo(12, 8, 6, 14); ctx.quadraticCurveTo(-8, 4, -14, -10); ctx.quadraticCurveTo(-8, -16, -12, -24); ctx.closePath(); ctx.fill(); ctx.restore(); }
function callScreen(t, t0, who, sub) {
  // a phone-call screen shown on the TV: contact circle, name, "Calling…" and ring pulses
  const cx = SX + SWd / 2, cy = SY + 220;
  const k = Math.min(1.06, sp(t - t0, { freq: 3, damp: 0.7 }));
  for (let i = 0; i < 3; i++) { const p = ((t - t0) * 0.9 + i / 3) % 1; if (t < t0) break; circ(cx, cy, 90 + p * 150); ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - p)})`; ctx.lineWidth = 4; ctx.stroke(); }
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
  circ(0, 0, 88); ctx.fillStyle = C.coral; ctx.fill(); ctx.fillStyle = WHITE; ctx.font = '72px "Righteous"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(who[0], 0, 6);
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = WHITE;
  fitFont(who, '700 # "Outfit"', 52, SWd - 80); ctx.fillText(who, cx, cy + 160);
  ctx.font = '500 34px "Outfit"'; ctx.fillStyle = 'rgba(255,255,255,.8)';
  const dots = '.'.repeat(1 + (Math.floor(t * 3) % 3)); ctx.fillText(sub + dots, cx, cy + 210);
  // red end button at the bottom of the screen
  circ(cx, SY + SHt - 90, 48); ctx.fillStyle = RED; ctx.fill(); ctx.save(); ctx.translate(cx, SY + SHt - 90); ctx.rotate(2.35); phoneIcon(0, 0, 0.75, WHITE); ctx.restore();
}
function sinkIcon(t, x, y, a = 1) {
  // a little leaking faucet in the corner of the screen, drips on the DRIPS times
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  ctx.fillStyle = '#C9D3F5'; rr(-40, -10, 70, 20, 8); ctx.fill(); rr(14, -10, 18, 46, 8); ctx.fill(); rr(-18, -32, 22, 26, 6); ctx.fill();
  for (const d of DRIPS) { const p = (t - d) / 0.55; if (p < 0 || p > 1) continue; const dy = 40 + p * p * 120;
    ctx.fillStyle = `rgba(150,200,255,${1 - p * 0.6})`; ctx.beginPath(); ctx.ellipse(23, dy, 7, 10, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(150,200,255,.35)'; ctx.beginPath(); ctx.ellipse(23, 172, 46, 8, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function titleCard(t) {
  const cx = SX + SWd / 2, k = Math.min(1.08, sp(t - T.song, { freq: 2.8, damp: 0.62 }));
  ctx.save(); ctx.translate(cx, SY + 250); ctx.scale(k, k); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 30px "Outfit"'; ctx.letterSpacing = '8px'; ctx.fillStyle = C.sun; ctx.fillText('♪ NOW PLAYING ♪', 0, -110); ctx.letterSpacing = '0px';
  ctx.font = '62px "Righteous"'; ctx.fillStyle = WHITE; ctx.fillText('“Your Voicemail', 0, -20); ctx.fillText('Greeting”', 0, 56);
  ctx.font = '500 30px "Outfit"'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('by: the plumber who didn’t pick up', 0, 130);
  ctx.restore();
}
// lyric lines (two rows each): the current line fills with sun yellow left to right, row by row; a coral ball bounces
// from word to word just ahead of the fill
function lyricLine(l, t, y, active, frozen = null) {
  const cx = SX + SWd / 2, rows = l.text.split('|');
  let size = active ? 62 : 40; ctx.font = `${size}px "Righteous"`;
  const mw = Math.max(...rows.map(r => ctx.measureText(r).width)); if (mw > SWd - 70) { size = Math.floor(size * (SWd - 70) / mw); ctx.font = `${size}px "Righteous"`; }
  const lh = size * (active ? 1.9 : 1.18), ws = rows.map(r => ctx.measureText(r).width), total = ws.reduce((a, b) => a + b, 0);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  rows.forEach((r, i) => { const x0 = cx - ws[i] / 2, yy = y + i * lh;
    ctx.lineWidth = active ? 9 : 6; ctx.strokeStyle = 'rgba(8,10,40,.9)'; ctx.strokeText(r, x0, yy);
    ctx.fillStyle = active ? WHITE : 'rgba(255,255,255,.5)'; ctx.fillText(r, x0, yy); });
  if (!active) return;
  const k = Math.min(1, seg(frozen ?? t, l.t0, l.t0 + (l.t1 - l.t0) * (l.cut ?? 0.95)));
  let fill = total * k, ballX = cx, ballY = y, row = 0;
  rows.forEach((r, i) => { const x0 = cx - ws[i] / 2, yy = y + i * lh, f = clamp(fill - ws.slice(0, i).reduce((a, b) => a + b, 0), 0, ws[i]);
    if (f > 0) { ctx.save(); ctx.beginPath(); ctx.rect(x0, yy - size, f, size * 1.4); ctx.clip(); ctx.fillStyle = C.sun; ctx.fillText(r, x0, yy); ctx.restore(); }
    if (f > 0 && f < ws[i] + 0.5) { row = i; ballX = x0 + f; ballY = yy; } });
  if (k >= 1) { const i = rows.length - 1; ballX = cx + ws[i] / 2; ballY = y + i * lh; row = i; }
  // hop per word: height from where the fill sits inside the current word
  const r = rows[row], x0 = cx - ws[row] / 2, rel = ballX - x0; let a = 0, b = ws[row], pos = 0;
  for (const w of r.split(' ')) { const wa = ctx.measureText(r.slice(0, pos)).width, wb = ctx.measureText(r.slice(0, pos + w.length)).width; if (rel >= wa && rel <= wb + 8) { a = wa; b = wb; break; } pos += w.length + 1; }
  const p = clamp((rel - a) / Math.max(1, b - a)), by = ballY - size * 0.95 - 14 - 18 * Math.sin(Math.PI * p);
  circ(ballX, by, 15); ctx.fillStyle = C.coral; ctx.fill(); circ(ballX - 4, by - 4, 4); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
}
function progress(t, frozen = null) {
  // song progress bar: 0:00 → it crawls; total 0:41 (a long greeting)
  const y = SY + SHt - 56, x = SX + 60, w = SWd - 120, tt = frozen ?? t;
  const secs = Math.max(0, (tt - T.song) * 0.9); const k = Math.min(1, secs / 41);
  rr(x, y, w, 10, 5); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill();
  rr(x, y, Math.max(10, w * k), 10, 5); ctx.fillStyle = C.sun; ctx.fill(); circ(x + w * k, y + 5, 11); ctx.fillStyle = WHITE; ctx.fill();
  ctx.font = '700 26px "Outfit"'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = 'rgba(255,255,255,.85)';
  const s = Math.floor(secs); ctx.textAlign = 'left'; ctx.fillText(`0:${String(s).padStart(2, '0')}`, x, y - 14); ctx.textAlign = 'right'; ctx.fillText('0:41', x + w, y - 14);
}
function lyrics(t) {
  const frozen = t >= T.hang ? T.hang : null, tt = frozen ?? t;
  let i = LYRICS.findIndex(l => tt >= l.t0 && tt < l.t1); if (i < 0) i = tt >= LYRICS[LYRICS.length - 1].t0 ? LYRICS.length - 1 : 0;
  const cur = LYRICS[i], nxt = LYRICS[i + 1];
  // the line slides up on each change
  const sl = 1 - E.outCubic(seg(tt, cur.t0, cur.t0 + 0.3));
  ctx.save(); ctx.translate(0, sl * 70); ctx.globalAlpha = 1 - sl * 0.6;
  ctx.font = '700 26px "Outfit"'; ctx.textAlign = 'center'; ctx.fillStyle = C.sun; ctx.letterSpacing = '6px'; ctx.fillText('♪ VOICEMAIL GREETING ♪', SX + SWd / 2, SY + 70); ctx.letterSpacing = '0px';
  lyricLine(cur, t, SY + 205, true, frozen);
  if (nxt) lyricLine(nxt, t, SY + 445, false);
  ctx.restore();
  progress(t, frozen);
}
function hangUp(t) {
  // lyrics freeze and dim; a big red "CALL ENDED" stamps on
  ctx.save(); ctx.globalAlpha = 0.12; lyrics(t); ctx.restore();
  ctx.fillStyle = 'rgba(10,8,30,.6)'; ctx.fillRect(SX, SY, SWd, SHt);
  const k = Math.min(1.12, sp(t - T.hang - 0.05, { freq: 3.4, damp: 0.5 }));
  ctx.save(); ctx.translate(SX + SWd / 2, SY + 270); ctx.rotate(-0.08); ctx.scale(k, k);
  circ(0, -40, 70); ctx.fillStyle = RED; ctx.fill(); ctx.save(); ctx.translate(0, -40); ctx.rotate(2.35); phoneIcon(0, 0, 1.1, WHITE); ctx.restore();
  rr(-250, 60, 500, 96, 18); ctx.fillStyle = RED; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = WHITE; ctx.font = '60px "Righteous"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CALL ENDED', 0, 110);
  ctx.restore();
  ctx.font = '700 30px "Outfit"'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillText('Message left: none', SX + SWd / 2, SY + 530);
}
function scoreScreen(t) {
  const cx = SX + SWd / 2, k = Math.min(1.1, sp(t - T.score, { freq: 2.8, damp: 0.6 }));
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 30px "Outfit"'; ctx.letterSpacing = '8px'; ctx.fillStyle = C.sun; ctx.fillText('YOUR SCORE', cx, SY + 110); ctx.letterSpacing = '0px';
  ctx.save(); ctx.translate(cx, SY + 290); ctx.scale(k, k);
  ctx.font = '230px "Righteous"'; ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(8,10,40,.9)'; ctx.strokeText('0', 0, 70); ctx.fillStyle = WHITE; ctx.fillText('0', 0, 70);
  ctx.restore();
  // five empty stars
  for (let i = 0; i < 5; i++) { const x = cx + (i - 2) * 74, y = SY + 420, s = Math.min(1, sp(t - T.score - 0.25 - i * 0.07, { freq: 3, damp: 0.6 }));
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, q = j % 2 ? 12 : 28; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q); } ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore(); }
  const a = seg(t, T.score + 0.5, T.score + 0.8);
  ctx.globalAlpha = a; fitFont('Nobody stayed for the beep.', '700 # "Outfit"', 40, SWd - 80); ctx.fillStyle = WHITE; ctx.fillText('Nobody stayed for the beep.', cx, SY + 530); ctx.globalAlpha = 1;
}
function yourGreeting(t) {
  // after "Call your own number tonight.": the screen asks what YOUR greeting sounds like
  const cx = SX + SWd / 2, k = Math.min(1.08, sp(t - T.ask, { freq: 2.8, damp: 0.62 }));
  ctx.save(); ctx.translate(cx, SY + 200); ctx.scale(k, k); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 30px "Outfit"'; ctx.letterSpacing = '8px'; ctx.fillStyle = C.sun; ctx.fillText('♪ NEXT SONG ♪', 0, -80); ctx.letterSpacing = '0px';
  ctx.font = '60px "Righteous"'; ctx.fillStyle = WHITE; ctx.fillText('“Your Voicemail', 0, 6); ctx.fillText('Greeting”', 0, 80);
  ctx.restore();
  const q = 1 + 0.07 * Math.sin(t * 6), qa = Math.min(1, sp(t - T.ask - 0.3, { freq: 3, damp: 0.6 }));
  ctx.save(); ctx.translate(cx, SY + 440); ctx.scale(q * qa, q * qa); ctx.font = '170px "Righteous"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(8,10,40,.9)'; ctx.strokeText('?', 0, 0); ctx.fillStyle = C.coral; ctx.fillText('?', 0, 0); ctx.restore();
  ctx.font = '700 26px "Outfit"'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.textAlign = 'left'; ctx.fillText('0:00', SX + 60, SY + SHt - 70); ctx.textAlign = 'right'; ctx.fillText('?:??', SX + SWd - 60, SY + SHt - 70);
  rr(SX + 60, SY + SHt - 56, SWd - 120, 10, 5); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill();
}
function screen(t) {
  ctx.save(); rr(SX, SY, SWd, SHt, 26); ctx.clip();
  // a quick "channel change" flash on each state change
  if (t < T.song) { screenBg(t, '#2A2350', '#110C2A'); callScreen(t, t < T.call ? 1e9 : T.call, 'Plumber', t < T.call ? 'Tap to call' : 'Calling'); sinkIcon(t, SX + 86, SY + 60); }
  else if (t < T.lyr) { screenBg(t); titleCard(t); sinkIcon(t, SX + 86, SY + 60, 0.8); }
  else if (t < T.hang) { screenBg(t); lyrics(t); }
  else if (t < T.next) { screenBg(t); hangUp(t); }
  else if (t < T.score) { screenBg(t, '#2A2350', '#110C2A'); callScreen(t, T.next, 'Plumber #2', 'Calling'); sinkIcon(t, SX + 86, SY + 60); }
  else if (t < T.tip) { screenBg(t); scoreScreen(t); }
  else if (t < T.ask) { screenBg(t, '#2A2350', '#110C2A'); callScreen(t, T.tip, 'Your business', 'Calling'); }
  else { screenBg(t); yourGreeting(t); }
  // static flash on cuts
  for (const k of [T.song, T.lyr, T.hang, T.next, T.score, T.tip, T.ask]) { const d = t - k; if (d >= 0 && d < 0.14) { ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - d / 0.14)})`; ctx.fillRect(SX, SY, SWd, SHt);
      for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(255,255,255,${0.4 * hash(i, Math.floor(t * 30))})`; ctx.fillRect(SX, SY + hash(i, 7 + Math.floor(t * 30)) * SHt, SWd, 3); } } }
  ctx.drawImage(SCAN, SX, SY);
  // glass reflection
  const gl = ctx.createLinearGradient(SX, SY, SX + SWd, SY + SHt); gl.addColorStop(0, 'rgba(255,255,255,.10)'); gl.addColorStop(0.35, 'rgba(255,255,255,0)'); ctx.fillStyle = gl; ctx.fillRect(SX, SY, SWd, SHt);
  ctx.restore();
}

// ── a microphone on a stand, left of the TV (background prop, sways a little)
function mic(t) {
  ctx.save(); ctx.translate(96, 1560); ctx.rotate(0.04 * Math.sin(t * 1.1));
  ctx.strokeStyle = '#8E86A0'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -330); ctx.stroke();
  ctx.save(); ctx.translate(0, -350); ctx.rotate(0.35); rr(-14, -8, 28, 80, 10); ctx.fillStyle = '#2B2436'; ctx.fill(); circ(0, -18, 24); ctx.fillStyle = '#B9B3C6'; ctx.fill(); ctx.restore();
  ctx.restore();
}

// ── camera: a punch on every beat and a slow drift
function cam(t) {
  let punch = 0; for (const k of HITS) if (t >= k) punch += 0.024 * Math.exp(-(t - k) * 8);
  return [540 + 5 * Math.sin(t * 0.6), 830 + 4 * Math.sin(t * 0.8), 1 + punch];
}

// ── overlays
function title(t) {
  const x = 140, y = 172, w = 800, h = 240;
  rr(x + 10, y + 12, w, h, 26); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
  rr(x, y, w, h, 26); ctx.fillStyle = C.cream; ctx.fill();
  // marquee bulbs along the top and bottom edges (chase lights)
  for (let i = 0; i < 18; i++) { const bx = x + 36 + i * 43.5, on = (i + Math.floor(t * 6)) % 3 === 0;
    for (const by of [y + 16, y + h - 16]) { circ(bx, by, 6); ctx.fillStyle = on ? C.sun : '#E7C9A0'; ctx.fill(); } }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 32px "Outfit"'; ctx.letterSpacing = '7px'; ctx.fillStyle = C.coral; ctx.fillText('PLUMBERS: HOT TAKE.', x + 44, y + 70); ctx.letterSpacing = '0px';
  fitFont('Nobody waits for the beep.', '# "Righteous"', 64, w - 88); ctx.fillStyle = INK; ctx.fillText('Nobody waits for the beep.', x + 44, y + 146);
  ctx.font = '62px "Righteous"'; ctx.fillStyle = '#2340B8'; ctx.fillText('Would you?', x + 44, y + 212);
}
function caption(c, t) {
  if (t < c.t0 || t >= c.t1) return;
  const k = c.t0 === 0 ? 1 : Math.min(1.1, sp(t - c.t0, { freq: 3.2, damp: 0.66 })), out = 1 - seg(t, c.t1 - 0.1, c.t1);
  let fsz = 50; ctx.font = `700 ${fsz}px "Outfit"`;
  if (ctx.measureText(c.text).width > 600) { fsz = Math.floor(50 * 600 / ctx.measureText(c.text).width); ctx.font = `700 ${fsz}px "Outfit"`; }
  const i = c.text.indexOf(c.hi), pre = c.text.slice(0, i), post = c.text.slice(i + c.hi.length);
  const w0 = ctx.measureText(pre).width, w1 = ctx.measureText(c.hi).width, w2 = ctx.measureText(post).width, tw = w0 + w1 + w2, w = tw + 76, h = 98;
  ctx.save(); ctx.globalAlpha = out * Math.min(1, k * 2); ctx.translate(500, 1340); ctx.scale(0.88 + 0.12 * Math.min(1.1, k), 0.88 + 0.12 * Math.min(1.1, k));
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = 'rgba(12,8,30,.92)'; ctx.fill(); ctx.strokeStyle = C.coral; ctx.lineWidth = 4; ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; let x = -tw / 2; const by = fsz * 0.35;
  ctx.fillStyle = WHITE; ctx.fillText(pre, x, by); x += w0;
  ctx.fillStyle = C.sun; ctx.fillText(c.hi, x, by); x += w1;
  ctx.fillStyle = WHITE; ctx.fillText(post, x, by);
  ctx.restore();
}

// ── end card: the TV screen zooms to fill the frame and turns plum
let LOGO;
function endCard(t) {
  const k = E.inOutCubic(seg(t, T.end, T.shut));
  const x = lerp(SX, -40, k), y = lerp(SY, -40, k), w = lerp(SWd, 1160, k), h = lerp(SHt, 2000, k);
  ctx.save(); rr(x, y, w, h, lerp(26, 0, k)); ctx.clip();
  ctx.fillStyle = C.plum; ctx.fillRect(0, 0, 1080, 1920);
  const glow = ctx.createRadialGradient(540, 640, 0, 540, 640, 780), ga = seg(t, T.end, T.shut); glow.addColorStop(0, `rgba(240,100,90,${0.3 * ga})`); glow.addColorStop(1, 'rgba(240,100,90,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, 1080, 1920);
  for (let i = 0; i < 40; i++) { const [sx, sy, p] = SPARK[i]; const a = Math.max(0, Math.sin(t * (2 + p * 3) + p * 40)) ** 6; ctx.fillStyle = `rgba(255,210,122,${0.5 * a})`; ctx.fillRect(sx - 3, sy * 1.2 - 1, 6, 2); ctx.fillRect(sx - 1, sy * 1.2 - 3, 2, 6); }
  const z = 1 + 0.006 * Math.max(0, t - T.shut); ctx.translate(540, 860); ctx.scale(z, z); ctx.translate(-540, -860);
  const rise = (t0, fn) => { const q = Math.min(1, sp(t - t0, { freq: 2.6, damp: 0.8 })); if (q <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, q * 1.5); ctx.translate(0, (1 - q) * 30); fn(); ctx.restore(); };
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  rise(T.logo, () => { const w = 700, h = w * LOGO.height / LOGO.width; ctx.save(); ctx.globalCompositeOperation = 'lighten'; ctx.drawImage(LOGO, 540 - w / 2, 560 - h / 2, w, h); ctx.restore(); });
  rise(T.tag1, () => { ctx.font = '400 66px "Young Serif"'; ctx.fillStyle = C.cream; ctx.fillText('You run the business.', 540, 880); });
  rise(T.tag2, () => { ctx.font = '400 66px "Young Serif"'; ctx.fillStyle = C.coralLite; ctx.fillText('We help it scale.', 540, 968); });
  rise(T.serv, () => { ctx.font = '600 32px "Poppins"'; ctx.fillStyle = C.coralLite; ctx.fillText('Websites · Ads · AI receptionists', 540, 1100); });
  rise(T.url, () => { ctx.font = '800 44px "Nunito"'; ctx.fillStyle = C.cream; ctx.fillText('horizonscales.com', 540, 1174); });
  ctx.restore();
}

window.READY = false; window.DUR = DUR;
window.render = t => {
  if (MODE === 'thumb') t = 0.6;
  t = Math.round(t * 1e5) / 1e5;
  ctx.save(); ctx.scale(SC, SC);
  ctx.fillStyle = '#160A2A'; ctx.fillRect(0, 0, 1080, 1920);
  if (t < T.shut) {
    lounge(t);
    const [fx, fy, z] = cam(t);
    ctx.save(); ctx.translate(540, 830); ctx.scale(z, z); ctx.translate(-fx, -fy);
    mic(t); tvFrame(t); screen(t);
    ctx.restore();
    title(t); CAPS.forEach(cp => caption(cp, t));
  } else { ctx.fillStyle = C.plum; ctx.fillRect(0, 0, 1080, 1920); }
  if (t >= T.end) endCard(t);
  ctx.restore();
};
