<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Reply — Horizon Scales</title>
<style>
  @font-face { font-family: "Outfit"; src: url(fonts/Outfit-500.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Outfit"; src: url(fonts/Outfit-700.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: "Young Serif"; src: url(fonts/YoungSerif.woff2) format("woff2"); }
  @font-face { font-family: "Nunito"; src: url(fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; background: #CFE0D4; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { DUR, T, CAPS, HITS, TAPS } from './timeline.js';
import { seg, ease as E, spring, stageSize, setupCanvas, loadFonts, loadImage, lerp, TAU } from './motion.js';

const { W: SW_, H: SH_ } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), SW_, SH_);
const SC = SW_ / 1080;
const MODE = new URLSearchParams(location.search).get('dir');
const C = { plum: 'rgb(28,2,40)', coral: '#F0645A', coralLite: '#F5A39A', cream: '#F6F0E6', sun: '#FFD27A' };
// Plain (RUNBOOK v2): her phone in front of a sage kitchen-tile wall, the real screens (a website form, texts).
const INK = '#23282B', SAGE = '#CFE0D4', GROUT = '#B7CDBE', WHITE = '#FFFFFF', GREEN = '#2FA36B', BLUE = '#2F7CF6', GREY = '#8A9094', LIGHT = '#EEF1F3';
const sp = (x, o) => (x <= 0 ? 0 : spring(x, o));
const F = '"Outfit"';
// frame safety: hook block y 180–410 (x 140–940); phone x 300–740, y 520–1220, tag at y 450;
// captions centred at x 520 around y 1350 (≤ 640 wide); nothing right of x 864 below y 920 or under y 1630.

const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); };
const text = (s, x, y, font, col, align = 'center') => { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); };
const check = (x, y, s, col, w = 6) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x - s * 0.3, y + s * 0.7); ctx.lineTo(x + s, y - s * 0.7); ctx.stroke(); };

// ── background: subway tiles, a slow drift, and the sparking outlet on the wall
function background(t) {
  ctx.fillStyle = GROUT; ctx.fillRect(0, 0, 1080, 1920);
  const tw = 180, th = 90, dy = 10 * Math.sin(t * 0.35);
  for (let r = -1; r < 23; r++) for (let c = -1; c < 8; c++) {
    const x = c * tw + (r % 2 ? tw / 2 : 0), y = r * th + dy;
    rr(x + 4, y + 4, tw - 8, th - 8, 10); ctx.fillStyle = SAGE; ctx.fill();
    rr(x + 10, y + 8, tw - 40, 10, 5); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  }
  // outlet plate (left of the phone), sparking in the first beats
  const ox = 200, oy = 760;
  rr(ox - 56, oy - 86, 112, 172, 16); ctx.fillStyle = '#FBFAF6'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 3; ctx.stroke();
  for (const sy of [-38, 38]) { rr(ox - 30, oy + sy - 26, 60, 52, 18); ctx.fillStyle = '#ECE8DF'; ctx.fill();
    ctx.fillStyle = '#3A3F44'; ctx.fillRect(ox - 16, oy + sy - 14, 7, 20); ctx.fillRect(ox + 9, oy + sy - 14, 7, 20); circ(ox, oy + sy + 14, 5); ctx.fill(); }
  // scorch mark
  const g = ctx.createRadialGradient(ox + 4, oy - 60, 0, ox + 4, oy - 60, 46); g.addColorStop(0, 'rgba(40,30,20,.45)'); g.addColorStop(1, 'rgba(40,30,20,0)'); ctx.fillStyle = g; ctx.fillRect(ox - 60, oy - 120, 130, 120);
  const sparking = t < T.book ? 1 : 0;
  if (sparking) {
    const ph = Math.floor(t * 9);
    if (ph % 3 !== 2) for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + ((i * 53 + ph * 37) % 100 - 50) / 50 * 1.1, len = 26 + ((i * 29 + ph * 13) % 30);
      const x0 = ox + 0, y0 = oy - 52;
      ctx.strokeStyle = i % 2 ? C.sun : '#FFF4C8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0 + Math.cos(a) * 8, y0 + Math.sin(a) * 8); ctx.lineTo(x0 + Math.cos(a) * len, y0 + Math.sin(a) * len); ctx.stroke();
    }
  }
}

// ── the phone (screen 440 × 680 at PX, PY)
const PX = 300, PY = 540, PW = 440, PH = 680, CX = PX + PW / 2;
function pop(t, t0, fn, cx, cy) { const k = Math.min(1.05, sp(t - t0, { freq: 3, damp: 0.7 })); if (k <= 0.01) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function clockAt(t) {
  const keys = [[0, 9 * 60 + 12], [T.form2, 9 * 60 + 14], [T.reply + 0.3, 9 * 60 + 21], [T.book + 0.5, 9 * 60 + 23]];
  let m = keys[0][1]; for (const [k, v] of keys) if (t >= k) m = v;
  if (t >= T.late) { const k = E.inOutCubic(seg(t, T.late + 0.1, T.late + 1.2)); m = Math.round(lerp(9 * 60 + 23, 16 * 60 + 40, k)); }
  if (t >= T.fixed + 0.3) m = 16 * 60 + 41;
  const h = m / 60 | 0, mm = m % 60; return { s: `${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')}`, ap: h < 12 ? 'AM' : 'PM' };
}
function statusBar(t, dark) {
  const c = clockAt(t);
  text(`${c.s} ${c.ap}`, PX + 40, PY + 44, `700 26px ${F}`, dark ? WHITE : INK, 'left');
  ctx.fillStyle = dark ? WHITE : INK; for (let i = 0; i < 4; i++) ctx.fillRect(PX + PW - 120 + i * 11, PY + 40 - 6 - i * 5, 7, 6 + i * 5);
  rr(PX + PW - 66, PY + 22, 36, 20, 5); ctx.strokeStyle = dark ? WHITE : INK; ctx.lineWidth = 2.5; ctx.stroke(); ctx.fillRect(PX + PW - 63, PY + 25, 26, 14);
}
// a website contact form; typed: 0..1 how much of the message is typed; sent: time the Send was tapped
function formScreen(t, t0, site, siteCol, typeK, tapAt) {
  ctx.fillStyle = WHITE; ctx.fillRect(PX, PY, PW, PH);
  statusBar(t, false);
  // site header
  ctx.fillStyle = siteCol; ctx.fillRect(PX, PY + 66, PW, 96);
  text(site, CX, PY + 126, `700 32px ${F}`, WHITE);
  text('Request service', PX + 36, PY + 222, `700 40px ${F}`, INK, 'left');
  text('What’s wrong?', PX + 36, PY + 272, `500 26px ${F}`, GREY, 'left');
  rr(PX + 30, PY + 288, PW - 60, 190, 18); ctx.fillStyle = LIGHT; ctx.fill(); ctx.strokeStyle = '#C9D0D5'; ctx.lineWidth = 2.5; ctx.stroke();
  const msg = ['Kitchen outlet is', 'sparking. Can someone', 'come today?'];
  const total = msg.join('').length; let n = Math.floor(total * typeK);
  msg.forEach((ln, i) => { const s = ln.slice(0, Math.max(0, n)); n -= ln.length; text(s, PX + 54, PY + 336 + i * 44, `500 30px ${F}`, INK, 'left'); });
  if (typeK < 1 && Math.floor(t * 3) % 2 === 0) { /* caret blinks while typing */ }
  // Send button, pressed at tapAt, then "Sent"
  const sent = t >= tapAt + 0.25, press = Math.exp(-Math.max(0, t - tapAt) * 10) * (t >= tapAt ? 1 : 0);
  const bw = PW - 60, by = PY + 510;
  ctx.save(); ctx.translate(CX, by + 44); ctx.scale(1 - 0.06 * press, 1 - 0.06 * press); ctx.translate(-CX, -(by + 44));
  rr(PX + 30, by, bw, 88, 44); ctx.fillStyle = sent ? GREEN : siteCol; ctx.fill();
  if (sent) { check(CX - 64, by + 44, 14, WHITE, 6); text('Sent', CX + 18, by + 56, `700 34px ${F}`, WHITE); }
  else text('Send', CX, by + 56, `700 34px ${F}`, WHITE);
  ctx.restore();
  if (sent) pop(t, tapAt + 0.35, () => text('We’ll get back to you.', CX, PY + 650, `500 26px ${F}`, GREY), CX, PY + 640);
  // the thumb comes in for the tap
  const th = seg(t, tapAt - 0.45, tapAt) * (1 - seg(t, tapAt + 0.2, tapAt + 0.6));
  if (th > 0) { ctx.globalAlpha = th; circ(CX + 40, by + 44 + (1 - th) * 80, 34); ctx.fillStyle = 'rgba(35,40,43,.25)'; ctx.fill(); ctx.globalAlpha = 1; }
}
function bubble(t, t0, lines, y, mine) {
  ctx.font = `500 30px ${F}`;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 48, h = 28 + lines.length * 40;
  const x = mine ? PX + PW - 24 - w : PX + 24;
  pop(t, t0, () => {
    rr(x, y, w, h, 26); ctx.fillStyle = mine ? BLUE : LIGHT; ctx.fill();
    lines.forEach((l, i) => text(l, x + 24, y + 46 + i * 40, `500 30px ${F}`, mine ? WHITE : INK, 'left'));
  }, mine ? x + w : x, y + h / 2);
  return h;
}
function threadScreen(t, who, avatarCol, items) {
  ctx.fillStyle = WHITE; ctx.fillRect(PX, PY, PW, PH);
  statusBar(t, false);
  ctx.fillStyle = '#F6F7F8'; ctx.fillRect(PX, PY + 62, PW, 150); ctx.fillStyle = '#E3E6E8'; ctx.fillRect(PX, PY + 210, PW, 2);
  circ(CX, PY + 118, 34); ctx.fillStyle = avatarCol; ctx.fill(); text(who[0], CX, PY + 130, `700 32px ${F}`, WHITE);
  text(who, CX, PY + 188, `700 28px ${F}`, INK);
  let y = PY + 240;
  for (const it of items) { if (t < it.t0) continue; if (it.card) { pop(t, it.t0, () => {
      rr(PX + 40, y, PW - 80, 120, 22); ctx.fillStyle = '#E6F5EC'; ctx.fill(); ctx.strokeStyle = GREEN; ctx.lineWidth = 3; ctx.stroke();
      circ(PX + 92, y + 60, 28); ctx.fillStyle = GREEN; ctx.fill(); check(PX + 92, y + 60, 12, WHITE, 5);
      text('Booked', PX + 136, y + 52, `700 32px ${F}`, INK, 'left'); text('Today, 2:00 PM', PX + 136, y + 92, `500 26px ${F}`, '#3D6B52', 'left'); }, CX, y + 60); y += 140; }
    else y += bubble(t, it.t0, it.lines, y, it.mine) + 18; }
}
function lockScreen(t) {
  const g = ctx.createLinearGradient(0, PY, 0, PY + PH); g.addColorStop(0, '#3B5B4B'); g.addColorStop(1, '#1D2D26'); ctx.fillStyle = g; ctx.fillRect(PX, PY, PW, PH);
  const c = clockAt(t);
  text(c.s, CX - 24, PY + 180, `700 108px ${F}`, WHITE); text(c.ap, CX + 146, PY + 180, `700 36px ${F}`, 'rgba(255,255,255,.75)', 'left');
  text('Same day', CX, PY + 226, `500 28px ${F}`, 'rgba(255,255,255,.7)');
  pop(t, T.late + 1.25, () => { const y = PY + 290;
    rr(PX + 24, y, PW - 48, 170, 24); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
    circ(PX + 78, y + 58, 28); ctx.fillStyle = C.coral; ctx.fill(); text('Y', PX + 78, y + 69, `700 28px ${F}`, WHITE);
    text('Your business', PX + 120, y + 52, `700 28px ${F}`, INK, 'left'); text('4:40 PM', PX + PW - 44, y + 52, `500 22px ${F}`, GREY, 'right');
    text('Hi, thanks for reaching', PX + 48, y + 106, `500 27px ${F}`, '#4A5054', 'left'); text('out! When works for you?', PX + 48, y + 142, `500 27px ${F}`, '#4A5054', 'left'); }, CX, PY + 375);
}
function listScreen(t) {
  ctx.fillStyle = WHITE; ctx.fillRect(PX, PY, PW, PH);
  statusBar(t, false);
  text('Messages', PX + 36, PY + 132, `700 46px ${F}`, INK, 'left');
  const row = (i, t0, name, col, line, time, badge) => pop(t, t0, () => { const y = PY + 170 + i * 170;
    rr(PX + 18, y, PW - 36, 150, 22); ctx.fillStyle = i === 0 ? '#E6F5EC' : LIGHT; ctx.fill();
    circ(PX + 76, y + 75, 34); ctx.fillStyle = col; ctx.fill(); text(name[0], PX + 76, y + 87, `700 30px ${F}`, WHITE);
    text(name, PX + 126, y + 50, `700 28px ${F}`, INK, 'left');
    text(line, PX + 126, y + 90, `500 25px ${F}`, '#4A5054', 'left');
    text(time, PX + 126, y + 126, `500 22px ${F}`, GREY, 'left');
    if (badge) { circ(PX + PW - 60, y + 75, 22); ctx.fillStyle = GREEN; ctx.fill(); check(PX + PW - 60, y + 75, 9, WHITE, 4); }
  }, CX, PY + 245 + i * 170);
  row(0, T.list + 0.15, 'Next electrician', '#4C8B6A', 'Booked · 2:00 PM', '9:23 AM', true);
  row(1, T.list + 0.6, 'Your business', C.coral, 'Already fixed, thanks!', '4:41 PM', false);
}
function screen(t) {
  ctx.save(); rr(PX, PY, PW, PH, 34); ctx.clip();
  if (t < T.form2) formScreen(t, 0, 'Your website', C.coral, E.outCubic(seg(t, -0.25, 1.7)), TAPS[0]);
  else if (t < T.reply) formScreen(t, T.form2, 'Next electrician’s site', '#4C8B6A', E.outCubic(seg(t, T.form2 + 0.2, T.form2 + 1.0)), TAPS[1]);
  else if (t < T.late) threadScreen(t, 'Next electrician', '#4C8B6A', [
    { t0: T.reply + 0.3, lines: ['Hi! Got your form.', 'Can we come at 2 today?'] },
    { t0: T.book + 0.5, lines: ['Yes please!'], mine: true },
    { t0: T.book + 1.2, card: true }]);
  else if (t < T.fixed) lockScreen(t);
  else if (t < T.list) threadScreen(t, 'Your business', C.coral, [
    { t0: T.fixed - 1, lines: ['Hi, thanks for reaching', 'out! When works for you?'] },
    { t0: T.fixed + 0.3, lines: ['Already fixed, thanks!'], mine: true }]);
  else listScreen(t);
  ctx.restore();
}
function phone(t) {
  const tag = 'HER PHONE';
  ctx.font = `700 30px ${F}`; ctx.letterSpacing = '6px'; const tw = ctx.measureText(tag).width + 56;
  rr(520 - tw / 2, 450, tw, 56, 28); ctx.fillStyle = INK; ctx.fill(); text(tag, 520 + 3, 489, `700 30px ${F}`, WHITE); ctx.letterSpacing = '0px';
  rr(PX - 20 + 12, PY - 20 + 18, PW + 40, PH + 40, 52); ctx.fillStyle = 'rgba(30,50,40,.25)'; ctx.fill();
  rr(PX - 20, PY - 20, PW + 40, PH + 40, 52); ctx.fillStyle = '#16191B'; ctx.fill();
  screen(t);
}
function cam(t) { let punch = 0; for (const k of HITS) if (t >= k) punch += 0.022 * Math.exp(-(t - k) * 8); return 1 + punch + 0.004 * Math.sin(t * 0.9); }

function title() {
  const x = 140, y = 180, w = 800, h = 230;
  rr(x + 8, y + 10, w, h, 24); ctx.fillStyle = 'rgba(30,50,40,.22)'; ctx.fill();
  rr(x, y, w, h, 24); ctx.fillStyle = WHITE; ctx.fill();
  ctx.fillStyle = C.coral; rr(x, y, 14, h, [24, 0, 0, 24]); ctx.fill();
  ctx.letterSpacing = '7px'; text('ELECTRICIANS:', x + 52, y + 62, `700 30px ${F}`, C.coral, 'left'); ctx.letterSpacing = '0px';
  text('She sent 2 of you a form.', x + 52, y + 132, `700 54px ${F}`, INK, 'left');
  text('Who replies first?', x + 52, y + 198, `700 54px ${F}`, C.coral, 'left');
}
function caption(c, t) {
  if (t < c.t0 || t >= c.t1) return;
  const k = c.t0 === 0 ? 1 : Math.min(1.08, sp(t - c.t0, { freq: 3.2, damp: 0.7 })), out = 1 - seg(t, c.t1 - 0.1, c.t1);
  const lines = c.text.split('\n'); let fsz = 54; ctx.font = `700 ${fsz}px ${F}`;
  const maxw = Math.max(...lines.map(l => ctx.measureText(l).width));
  if (maxw > 620) { fsz = Math.floor(54 * 620 / maxw); ctx.font = `700 ${fsz}px ${F}`; }
  const tw = Math.max(...lines.map(l => ctx.measureText(l).width)), lh = fsz * 1.2, w = tw + 64, h = 50 + lh * lines.length;
  ctx.save(); ctx.globalAlpha = out * Math.min(1, k * 2); ctx.translate(520, 1350 + (lines.length - 1) * lh / 2); ctx.scale(0.9 + 0.1 * k, 0.9 + 0.1 * k);
  rr(-w / 2 + 6, -h / 2 + 8, w, h, 22); ctx.fillStyle = 'rgba(30,50,40,.25)'; ctx.fill();
  rr(-w / 2, -h / 2, w, h, 22); ctx.fillStyle = INK; ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  lines.forEach((ln, j) => {
    const by = -((lines.length - 1) * lh) / 2 + j * lh + fsz * 0.35, i = ln.indexOf(c.hi);
    const pre = i < 0 ? ln : ln.slice(0, i), hi = i < 0 ? '' : c.hi, post = i < 0 ? '' : ln.slice(i + c.hi.length);
    let x = -ctx.measureText(ln).width / 2;
    ctx.fillStyle = WHITE; ctx.fillText(pre, x, by); x += ctx.measureText(pre).width;
    ctx.fillStyle = C.sun; ctx.fillText(hi, x, by); x += ctx.measureText(hi).width; ctx.fillStyle = WHITE; ctx.fillText(post, x, by);
  });
  ctx.restore();
}

let LOGO;
function endCard(t) {
  const k = E.inOutCubic(seg(t, T.end, T.shut));
  ctx.save(); circ(520, 880, 20 + 1700 * k); ctx.clip();
  ctx.fillStyle = C.plum; ctx.fillRect(0, 0, 1080, 1920);
  const glow = ctx.createRadialGradient(540, 640, 0, 540, 640, 780); glow.addColorStop(0, `rgba(240,100,90,${0.3 * k})`); glow.addColorStop(1, 'rgba(240,100,90,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, 1080, 1920);
  const z = 1 + 0.006 * Math.max(0, t - T.shut); ctx.translate(540, 860); ctx.scale(z, z); ctx.translate(-540, -860);
  const rise = (t0, fn) => { const q = Math.min(1, sp(t - t0, { freq: 2.6, damp: 0.8 })); if (q <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, q * 1.5); ctx.translate(0, (1 - q) * 30); fn(); ctx.restore(); };
  rise(T.logo, () => { const w = 700, h = w * LOGO.height / LOGO.width; ctx.save(); ctx.globalCompositeOperation = 'lighten'; ctx.drawImage(LOGO, 540 - w / 2, 560 - h / 2, w, h); ctx.restore(); });
  rise(T.tag1, () => text('You run the business.', 540, 880, '400 66px "Young Serif"', C.cream));
  rise(T.tag2, () => text('We help it scale.', 540, 968, '400 66px "Young Serif"', C.coralLite));
  rise(T.serv, () => text('Websites · Ads · AI receptionists', 540, 1100, `500 32px ${F}`, C.coralLite));
  rise(T.url, () => text('horizonscales.com', 540, 1174, '800 44px "Nunito"', C.cream));
  ctx.restore();
}

window.READY = false; window.DUR = DUR;
window.render = t => {
  if (MODE === 'thumb') t = 1.0;
  t = Math.round(t * 1e5) / 1e5;
  ctx.save(); ctx.scale(SC, SC);
  ctx.fillStyle = SAGE; ctx.fillRect(0, 0, 1080, 1920);
  if (t < T.shut) {
    background(t);
    const z = cam(t); ctx.save(); ctx.translate(520, 880); ctx.scale(z, z); ctx.translate(-520, -880); phone(t); ctx.restore();
    title(); CAPS.forEach(cp => caption(cp, t));
  }
  if (t >= T.end) endCard(t);
  ctx.restore();
};
await loadFonts(['400 66px "Young Serif"', '800 44px "Nunito"', `700 32px ${F}`, `500 32px ${F}`]);
LOGO = await loadImage('assets/logo-long.png');
window.render(0); window.READY = true;
</script>
</body>
</html>
