<canvas id="c"></canvas>
<script type="module">
import { DUR, T, CAPS, BUZZ, RINGS, CUTS, HITS, CUE } from './timeline.js';
import { seg, ease as E, spring, stageSize, setupCanvas, loadFonts, loadImage, rng, lerp, clamp, TAU } from './motion.js';

const { W: SW_, H: SH_ } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), SW_, SH_);
const SC = SW_ / 1080;
const C = { plum: 'rgb(28,2,40)', coral: '#F0645A', coralLite: '#F5A39A', cream: '#F6F0E6', sun: '#FFD27A' };
const INK = '#221530', AMBER = '#FFB84D', MINT = '#5FD6B4', RED = '#E5544A';
const sp = (x, o) => (x <= 0 ? 0 : spring(x, o));
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); };
const txt = (s, x, y, font, fill, ls = 0, align = 'center') => { ctx.font = font; ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.letterSpacing = '0px'; };
const inAny = (t, wins) => wins.some(([a, b]) => t >= a && t < b);
const F = (w, px) => `${w} ${px}px "Fredoka"`; const F_ = F;

const TEX = document.createElement('canvas'); TEX.width = 540; TEX.height = 960;
{ const g = TEX.getContext('2d'), r = rng(7);
  for (let i = 0; i < 4200; i++) { g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '0,0,0'},${0.02 + r() * 0.04})`; g.fillRect(r() * 540, r() * 960, 1 + r() * 2, 1 + r() * 2); } }

// ───────────────────────── the cartoon person (bust). Origin = base of the neck; s = 1 → head 240 px wide.
const MOODS = {
  neutral:   { b: 0.05, by: 0, ry: 30, m: 'smile' },
  focused:   { b: -0.25, by: 4, ry: 24, m: 'flat' },
  worried:   { b: 0.4, by: -2, ry: 31, m: 'frownS' },
  annoyed:   { b: -0.42, by: 6, ry: 20, m: 'slant' },
  happy:     { b: 0.12, by: -4, ry: 30, m: 'grin' },
  sad:       { b: 0.5, by: 0, ry: 26, m: 'frown' },
  surprised: { b: 0.1, by: -16, ry: 37, m: 'o' },
};
function toon(x, y, s, o) {
  const M = MOODS[o.mood || 'neutral'], [lx, ly] = o.look || [0, 0];
  ctx.save(); ctx.translate(x, y + (o.bob || 0)); ctx.scale(s, s);
  // torso
  ctx.beginPath(); ctx.moveTo(-205, 1000); ctx.lineTo(-205, 132); ctx.quadraticCurveTo(-198, 30, -84, 18); ctx.lineTo(84, 18); ctx.quadraticCurveTo(198, 30, 205, 132); ctx.lineTo(205, 1000); ctx.closePath();
  ctx.fillStyle = o.top; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
  if (o.deco) o.deco();

  circ(-118, 8, 24); ctx.fillStyle = o.skin; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke(); circ(118, 8, 24); ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(240,100,90,.32)'; circ(-80, 34, 19); ctx.fill(); circ(80, 34, 19); ctx.fill();
  // eyes

  for (const ex of [-44, 44]) {
    ctx.beginPath(); ctx.ellipse(ex, -6, 27, M.ry * blink, 0, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    if (blink === 1) { circ(ex + lx * 12, -6 + ly * Math.min(11, M.ry - 14), 13); ctx.fillStyle = INK; ctx.fill(); circ(ex + lx * 12 + 4, -11 + ly * 9, 4); ctx.fillStyle = '#FFFFFF'; ctx.fill(); }

    ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.strokeStyle = o.hair; ctx.beginPath(); ctx.moveTo(ex - sgn * 30, yb + M.b * 14); ctx.lineTo(ex + sgn * 28, yb - M.b * 30); ctx.stroke(); ctx.lineCap = 'butt';
  }

  ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.beginPath();
  if (M.m === 'grin') { ctx.moveTo(-40, 46); ctx.quadraticCurveTo(0, 54, 40, 46); ctx.quadraticCurveTo(34, 96, 0, 96); ctx.quadraticCurveTo(-34, 96, -40, 46); ctx.closePath(); ctx.fillStyle = '#5A1E26'; ctx.fill(); ctx.stroke(); ctx.fillStyle = '#FFFFFF'; rr(-28, 51, 56, 13, 5); ctx.fill(); }
  else if (M.m === 'o') { ctx.ellipse(0, 62, 17, 23, 0, 0, TAU); ctx.fillStyle = '#5A1E26'; ctx.fill(); ctx.stroke(); }
  else { if (M.m === 'smile') ctx.arc(0, 40, 28, 0.25, Math.PI - 0.25); else if (M.m === 'flat') { ctx.moveTo(-22, 58); ctx.lineTo(22, 58); } else if (M.m === 'slant') { ctx.moveTo(-24, 62); ctx.lineTo(24, 52); } else if (M.m === 'frownS') ctx.arc(0, 78, 24, Math.PI + 0.45, -0.45); else ctx.arc(0, 88, 32, Math.PI + 0.35, -0.35); ctx.stroke(); }
  ctx.lineCap = 'butt';

  ctx.lineWidth = 7; ctx.strokeStyle = INK;
  if (o.hat === 'cap') {
    ctx.beginPath(); ctx.arc(0, -34, 126, Math.PI, 0); ctx.closePath(); ctx.fillStyle = o.hatCol; ctx.fill(); ctx.stroke();
    rr(-140, -58, 280, 36, 18); ctx.fillStyle = o.hatCol2; ctx.fill(); ctx.stroke();
    circ(0, -104, 20); ctx.fillStyle = C.cream; ctx.fill();
  } else if (o.hat === 'bun') {
    ctx.beginPath(); ctx.moveTo(-121, -6); ctx.quadraticCurveTo(-112, -128, 0, -122); ctx.quadraticCurveTo(112, -128, 121, -6); ctx.quadraticCurveTo(70, -74, -20, -66); ctx.quadraticCurveTo(-90, -60, -121, -6); ctx.fillStyle = o.hair; ctx.fill(); ctx.stroke();
  }

    const sx = side * 172, sy = 98, ex = (sx + h[0]) / 2 + side * 58, ey = (sy + h[1]) / 2 + 46;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 76; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(h[0], h[1]); ctx.stroke();
    ctx.strokeStyle = o.sleeve || o.top; ctx.lineWidth = 62; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(h[0], h[1]); ctx.stroke();
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    const item = side < 0 ? o.lItem : o.rItem; if (item) item(h[0], h[1]);

const handPhone = (col = '#BFD7FF', rot = 0) => (hx, hy) => { ctx.save(); ctx.translate(hx, hy - 26); ctx.rotate(rot); rr(-34, -70, 68, 132, 14); ctx.fillStyle = '#0B0E1F'; ctx.fill(); rr(-26, -60, 52, 104, 8); ctx.fillStyle = col; ctx.fill(); ctx.restore(); };
function arcs(x, y, t, col, r0 = 60, both = true) {
  const ph = (t * 5) % 1; ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'round';
  for (const s of both ? [-1, 1] : [1]) for (let i = 0; i < 3; i++) { ctx.globalAlpha = 1 - (i + ph) / 3.2; ctx.beginPath(); ctx.arc(x, y, r0 + i * 30 + ph * 16, s > 0 ? -0.7 : Math.PI - 0.7, s > 0 ? 0.7 : Math.PI + 0.7); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
}

function bigPhone(x, y, k, rot, draw, glow) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 50; }
  rr(-140, -236, 280, 472, 40); ctx.fillStyle = '#0B0E1F'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
  ctx.save(); rr(-126, -222, 252, 444, 28); ctx.clip(); draw(); ctx.restore();
  rr(-34, -214, 68, 16, 8); ctx.fillStyle = '#0B0E1F'; ctx.fill();
  ctx.restore();
}
const slideIn = (t, t0) => lerp(1300, 712, Math.min(1, Math.min(1.04, sp(t - t0 + 0.02, { freq: 3, damp: 0.74 }))));
function avatar(y, col) { circ(0, y, 50); ctx.fillStyle = col; ctx.fill(); circ(0, y - 11, 17); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill(); ctx.beginPath(); ctx.arc(0, y + 40, 31, Math.PI, 0); ctx.fill(); }
function check(x, y, s, col, k = 1) { ctx.strokeStyle = col; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); const a = Math.min(1, k * 2), b = Math.max(0, k * 2 - 1); ctx.lineTo(x - s * 0.5 + s * 0.35 * a, y + s * 0.35 * a); if (b > 0) ctx.lineTo(x - s * 0.15 + s * 0.7 * b, y + s * 0.35 - s * 0.8 * b); ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; }
function dots(t, y, col) { const ph = (t * 1.6) % 1; for (let i = 0; i < 3; i++) { circ(-40 + i * 40, y, 11); ctx.fillStyle = col; ctx.globalAlpha = 0.3 + 0.7 * Math.max(0, 1 - Math.abs(ph * 3 - i)); ctx.fill(); } ctx.globalAlpha = 1; }
function badge(q, y, col, s1, fs = 40) { ctx.save(); ctx.translate(0, y); ctx.scale(q, q); rr(-116, -46, 232, 92, 22); ctx.fillStyle = col; ctx.fill(); txt(s1, 0, fs * 0.36, F(600, fs), '#FFFFFF', 1); ctx.restore(); }

function phoneAt(t, t0, draw, glow, shakeT, y = 772) {
  const shake = shakeT != null && t >= shakeT ? Math.sin((t - shakeT) * 60) * 10 * Math.exp(-(t - shakeT) * 9) : 0;
  bigPhone((t0 <= 0 ? 712 : slideIn(t, t0)) + shake, y + 5 * Math.sin(t * 1.5), 1.05, -0.03, draw, glow);
}
const pop = (t, t0) => Math.min(1.05, sp(t - t0, { freq: 3.3, damp: 0.62 }));
function stars(x, y, n, col) { ctx.fillStyle = col; for (let i = 0; i < 5; i++) { ctx.globalAlpha = i < n ? 1 : 0.25; ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 6.5 : 15; ctx.lineTo(x + i * 34 + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); } ctx.globalAlpha = 1; }

// ───────────────────────── autumn backyard with a picket fence. kind: 'broken' (her yard), 'job' (half rebuilt), 'new' (rebuilt)
const LEAFC = ['#E8892B', '#D9542B', '#F2C14E', '#B5432A'];
function yard(t, kind) {
  const g = ctx.createLinearGradient(0, 300, 0, 1150); g.addColorStop(0, '#BFE0F2'); g.addColorStop(1, '#FBE3C2'); ctx.fillStyle = g; ctx.fillRect(-300, -300, 1680, 2700);
  for (let i = 0; i < 9; i++) { const x = -220 + i * 200 + (i % 2) * 40, r = 150 + (i % 3) * 34; circ(x, 900 - (i % 2) * 40, r); ctx.fillStyle = LEAFC[(i + (kind === 'broken' ? 0 : 2)) % 3]; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.fillStyle = '#7DB36A'; ctx.fillRect(-300, 1130, 1680, 1200); ctx.fillStyle = 'rgba(40,90,40,.14)'; for (let x = -300; x < 1400; x += 170) ctx.fillRect(x, 1130, 85, 1200);
  // rails, then pickets
  const wood = kind === 'broken' ? '#F3EDE2' : '#E2B27A';
  ctx.lineWidth = 7; ctx.strokeStyle = INK;
  for (const y of [960, 1090]) { rr(-300, y, 1680, 30, 6); ctx.fillStyle = kind === 'broken' ? '#DDD5C6' : '#C99458'; ctx.fill(); ctx.stroke(); }
  for (let i = 0; i < 20; i++) {
    const x = -290 + i * 86; let rot = 0, dy = 0, col = wood;
    if (kind === 'broken' && i >= 10 && i <= 13) { if (i === 11) continue; rot = [0.5, 0, -0.75, 0.28][i - 10]; dy = [60, 0, 110, 30][i - 10]; }
    if (kind === 'job' && i < 7) col = '#F3EDE2';
    if (kind === 'job' && i > 14) continue;
    ctx.save(); ctx.translate(x + 32, 1180 + dy); ctx.rotate(rot + (rot ? Math.sin(t * 2 + i) * 0.015 : 0));
    ctx.beginPath(); ctx.moveTo(-32, 0); ctx.lineTo(-32, -270); ctx.lineTo(0, -310); ctx.lineTo(32, -270); ctx.lineTo(32, 0); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.stroke(); ctx.restore();
  }
  for (let i = 0; i < 16; i++) { const x = -200 + ((i * 137 + t * 46 * (1 + (i % 3) * 0.3)) % 1500), y = 320 + ((t * (120 + (i % 4) * 30) + i * 211) % 1500);
    ctx.save(); ctx.translate(x + Math.sin(t * 2 + i) * 30, y); ctx.rotate(t * 2.2 + i); ctx.beginPath(); ctx.ellipse(0, 0, 22, 11, 0, 0, TAU); ctx.fillStyle = LEAFC[i % 4]; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore(); }
}
// the fence company's website on the big phone. stale: old banner + faded photo; fresh: new banner + bright photo
function site(t, o) {
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-140, -240, 280, 480);
  ctx.fillStyle = '#2F4A3A'; ctx.fillRect(-140, -240, 280, 84); txt('FENCE CO.', 0, -172, F(600, 34), '#FFFFFF', 2);
  const bx = o.bannerX || 0;

  if (!o.fresh || bx) { ctx.save(); ctx.translate(bx, 0); const p = o.pulse || 0; ctx.translate(0, -114); ctx.scale(1 + 0.08 * p, 1 + 0.08 * p); rr(-116, -32, 232, 64, 14); ctx.fillStyle = RED; ctx.fill(); if (p > 0) { ctx.lineWidth = 7; ctx.strokeStyle = C.sun; ctx.stroke(); } txt('SPRING SALE!', 0, 11, F(600, 31), '#FFFFFF'); ctx.restore(); }

  for (let i = 0; i < 7; i++) { ctx.beginPath(); const x = -108 + i * 34; ctx.moveTo(x, 60); ctx.lineTo(x, -6); ctx.lineTo(x + 13, -24); ctx.lineTo(x + 26, -6); ctx.lineTo(x + 26, 60); ctx.closePath(); ctx.fillStyle = o.photo ? '#E2B27A' : '#DADBD8'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = o.photo ? INK : '#8D9096'; ctx.stroke(); }
  ctx.restore();

  rr(-116, 110, 232, 76, 20); ctx.fillStyle = o.fresh ? '#2FA37F' : '#B9BEC4'; ctx.fill(); txt('Call', 0, 160, F(600, 38), '#FFFFFF');
}
function callScreen(t, who, sub) { ctx.fillStyle = '#1B2550'; ctx.fillRect(-140, -240, 280, 480); txt('CALLING', 0, -146, F(600, 32), '#AFC0F4', 2); avatar(-62, '#40509A'); txt(who, 0, 46, F(600, 40), '#FFFFFF'); txt(sub, 0, 92, F(600, 40), '#FFFFFF'); dots(t, 150, '#AFC0F4'); }

// ───────────────────────── the homeowner
const HER = { skin: '#8D5A3C', skin2: '#754830', hair: '#1E1412', top: '#C8553D', sleeve: '#C8553D', hat: 'bun' };
const scarf = () => { rr(-96, -6, 192, 62, 26); ctx.fillStyle = C.cream; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke(); rr(30, 40, 60, 150, 16); ctx.fill(); ctx.stroke(); };
function thought(x, y, k, s, col) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(k, k); circ(-70, 96, 12); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); circ(-44, 66, 20); ctx.fill(); ctx.stroke();

// mode: 'q' (the question), 's1' (she opens it), 's3' (she calls the next builder), 'pay' (the ending)
function herScene(t, mode) {

  const mood = mode === 'pay' ? 'happy' : mode === 's3' ? (calling ? 'neutral' : 'annoyed') : mode === 's1' && t >= T.s1b ? 'surprised' : 'worried';

}

// ───────────────────────── the fence builder
const TECH = { skin: '#F0C3A0', skin2: '#D8A684', hair: '#7A4A22', top: '#4E7A4A', sleeve: '#4E7A4A', hat: 'cap', hatCol: '#E8892B', hatCol2: '#C26E1C', stubble: true };

// mode: 'm' (built once), 't' (never done), 'f1' (banner down), 'f2' (new photo)

  const working = mode === 'm', T0 = { m: T.m, t: T.truth, f1: T.fix1, f2: T.fix2 }[mode];

  const mood = mode === 'm' ? 'focused' : mode === 't' ? 'surprised' : mode === 'f1' ? 'neutral' : 'happy';
  toon(420, 980, 1.32, { ...TECH, t, mood, look: working ? [-0.8, 0.5] : [0.8, 0.2], tilt: working ? -0.04 : 0.05, bob: Math.sin(t * 2.1) * 3,
    deco: techDeco, lh: working ? [-236, 150 - tap * 40] : [-250, 300], rh: working ? [200, 300] : [196, 110],
    lItem: working ? (hx, hy) => hammer(hx, hy, -0.5 - tap * 0.6) : null, rItem: working ? null : handPhone(MINT, 0.15) });
  if (mode === 'm') phoneAt(t, T0 + 0.05, () => {
    ctx.fillStyle = '#1B2238'; ctx.fillRect(-140, -240, 280, 480); txt('YOUR', 0, -158, F(600, 34), '#AFC0F4', 2); txt('WEBSITE', 0, -116, F(600, 34), '#AFC0F4', 2);
    const q = Math.min(1, pop(t, T0 + 0.3)); circ(0, -36, 52 * q); ctx.fillStyle = MINT; ctx.fill(); check(-2, -42, 52, '#0E3B34', seg(t, T0 + 0.4, T0 + 0.7)); txt('Built once', 0, 64, F(600, 40), '#FFFFFF');
    if (t >= T.m2) { const k = pop(t, T.m2); ctx.save(); ctx.translate(0, 142); ctx.scale(k, k); rr(-118, -54, 236, 108, 22); ctx.fillStyle = RED; ctx.fill(); txt('Never', 0, -8, F(600, 38), '#FFFFFF'); txt('touched', 0, 34, F(600, 38), '#FFFFFF'); ctx.restore(); }
  }, t >= T.m2 ? RED : null, T.m2);
  else if (mode === 't') phoneAt(t, T0 + 0.05, () => {
    ctx.fillStyle = '#3B2A12'; ctx.fillRect(-140, -240, 280, 480); txt('YOUR', 0, -158, F(600, 34), C.sun, 2); txt('WEBSITE', 0, -116, F(600, 34), C.sun, 2);
    ctx.save(); ctx.translate(0, -24); ctx.rotate(t * 2.4); ctx.strokeStyle = C.sun; ctx.lineWidth = 13; ctx.lineCap = 'round'; for (const a of [0, Math.PI]) { ctx.beginPath(); ctx.arc(0, 0, 50, a + 0.5, a + 2.6); ctx.stroke(); ctx.save(); ctx.rotate(a + 2.6); ctx.translate(50, 0); ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(0, 16); ctx.lineTo(20, -6); ctx.stroke(); ctx.restore(); } ctx.lineCap = 'butt'; ctx.restore();
    const q = pop(t, T0 + 0.3); ctx.save(); ctx.translate(0, 104); ctx.scale(q, q); txt('Never', 0, 0, F(600, 54), '#FFFFFF'); txt('done', 0, 56, F(600, 54), C.sun); ctx.restore();
  }, C.sun, T0 + 0.3);
  else if (mode === 'f1') phoneAt(t, T0 + 0.05, () => {
    const k = E.inCubic(seg(t, T0 + 0.75, T0 + 1.15)); site(t, { fresh: true, bannerX: k < 1 ? 0.001 + k * 300 : 0, pulse: k > 0 ? 0 : 0.5 });
    if (k >= 1) { const q = pop(t, T0 + 1.15); ctx.save(); ctx.translate(92, -146); ctx.scale(q, q); circ(0, 0, 26); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke(); check(-1, -3, 26, '#1F8F78', 1); ctx.restore(); }
  }, t >= T0 + 1.15 ? MINT : RED, T0 + 1.15);
  else phoneAt(t, T0 + 0.05, () => site(t, { fresh: true, photo: t >= T0 + 0.7, photoK: pop(t, T0 + 0.85) }), MINT, T0 + 0.7);
}

// ───────────────────────── camera, overlays
function cam(t) {
  const starts = [0, T.m, T.s1, T.s3, T.bridge, T.truth, T.fix1, T.fix2, T.pay, T.end]; let a = 0, b = T.end;
  for (let i = 0; i < starts.length - 1; i++) if (t >= starts[i]) { a = starts[i]; b = starts[i + 1]; }
  const z = 1.03 + 0.05 * seg(t, a, b) + (t >= T.pay ? 0.12 * (1 - E.outCubic(seg(t, T.pay, T.pay + 1.6))) : 0);
  let punch = 0; for (const k of HITS) if (t >= k) punch += 0.04 * Math.exp(-(t - k) * 8);
  return [540 + 4 * Math.sin(t * 0.7), 860 + 3 * Math.sin(t * 0.9), z * (1 + punch)];
}
// the roadmap: three chips under the hook, the current one lit
function chips(t) {
  if (t < T.list) return;
  const P = [T.one, T.two, T.three], F = [T.fix1, T.fix2, T.fix3];
  for (let i = 0; i < 3; i++) {
    const q = Math.min(1.08, sp(t - T.list - i * 0.14, { freq: 3.4, damp: 0.6 })); if (q <= 0) continue;
    const fixing = t >= F[i] && (i === 2 ? t < T.pay : t < F[i + 1]);
    const done = t >= F[i] && !fixing;
    const problem = t >= P[i] && t < (i === 2 ? T.bridge : P[i + 1]);
    const on = problem || fixing, start = fixing ? F[i] : P[i];
    const k = on ? 1 + 0.25 * Math.exp(-(t - start) * 7) : 1;
    ctx.save(); ctx.translate(196 + i * 120, 462); ctx.scale(q * k, q * k);
    circ(0, 5, 46); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
    circ(0, 0, 46); ctx.fillStyle = fixing ? MINT : on ? C.sun : done ? MINT : C.cream; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
    if (done || (fixing && t > F[i] + 0.4)) check(0, -4, 44, INK, 1); else txt(String(i + 1), 0, 21, F_(600, 60), INK);
    ctx.restore();
  }
}
// the turn: the three problems on one card, each crossed out in red, while he says "here's how to fix all three"
function bridgeScene(t) {
  yard(t, 'job');
  toon(420, 980, 1.32, { ...TECH, t, mood: 'worried', look: [0.6, -0.3], tilt: 0.05, bob: Math.sin(t * 2.1) * 3, deco: techDeco, lh: [-250, 300], rh: [250, 300] });
  const q = Math.min(1.05, sp(t - T.bridge, { freq: 3, damp: 0.7 })); if (q <= 0) return;
  ctx.save(); ctx.translate(540, 820); ctx.scale(q, q);
  rr(-330, -230, 660, 470, 40); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  rr(-340, -244, 660, 470, 40); ctx.fillStyle = C.cream; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
  txt('Why she left:', -10, -160, F_(600, 56), INK);
  ['Built once', 'Old sale banner', 'Looked closed'].forEach((w, i) => {
    const y = -60 + i * 104, a = Math.min(1, sp(t - T.bridge - 0.25 - i * 0.18, { freq: 3.6, damp: 0.6 })); if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = Math.min(1, a * 2);
    circ(-250, y - 16, 34); ctx.fillStyle = RED; ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-264, y - 30); ctx.lineTo(-236, y - 2); ctx.moveTo(-236, y - 30); ctx.lineTo(-264, y - 2); ctx.stroke(); ctx.lineCap = 'butt';
    txt(w, -196, y, F_(600, 54), INK, 0, 'left'); ctx.restore();
  });
  ctx.restore();
}
function title() {
  rr(128, 190, 824, 206, 34); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
  rr(120, 180, 824, 206, 34); ctx.fillStyle = C.cream; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
  txt('Her fence blew down.', 532, 268, F(600, 66), INK);
  txt('Why did she think you closed?', 532, 350, F(600, 58), '#C2452B');
}
function caption([t0, t1, raw], t) {
  if (t < t0 || t >= t1) return;
  const lines = raw.split('/').map(l => l.split(/(\[[^\]]+\])/).filter(Boolean).map(p => p[0] === '[' ? [p.slice(1, -1), 1] : [p, 0]));
  let fs = 96; ctx.font = F(600, fs);
  const widest = Math.max(...lines.map(l => ctx.measureText(l.map(p => p[0]).join('')).width)); if (widest > 650) fs = Math.floor(96 * 650 / widest);
  const lh = fs * 1.08, y0 = 1372 - (lines.length - 1) * lh / 2;
  const out = 1 - seg(t, t1 - 0.08, t1);
  ctx.save(); ctx.globalAlpha = out; ctx.lineJoin = 'round'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  lines.forEach((l, i) => {
    const k = t0 === 0 ? 1 : Math.min(1.1, sp(t - t0 - i * 0.09, { freq: 3.4, damp: 0.6 })); if (k <= 0) return;
    ctx.font = F(600, fs); const w = ctx.measureText(l.map(p => p[0]).join('')).width;
    ctx.save(); ctx.translate(500, y0 + i * lh + (1 - Math.min(1, k)) * 26); ctx.scale(0.7 + 0.3 * k, 0.7 + 0.3 * k); ctx.globalAlpha = out * Math.min(1, k * 2.5);
    let x = -w / 2;
    for (const [s, hi] of l) { ctx.font = F(600, fs); ctx.lineWidth = fs * 0.2; ctx.strokeStyle = INK; ctx.strokeText(s, x, fs * 0.34); ctx.fillStyle = hi ? C.sun : '#FFFFFF'; ctx.fillText(s, x, fs * 0.34); x += ctx.measureText(s).width; }
    ctx.restore();
  });
  ctx.restore();
}
let LOGO;
function endCard(t) {
  const k = E.inOutCubic(seg(t, T.end, T.shut));
  ctx.save(); circ(712, 772, 2300 * k); ctx.clip();
  ctx.fillStyle = C.plum; ctx.fillRect(0, 0, 1080, 1920);
  const glow = ctx.createRadialGradient(540, 640, 0, 540, 640, 780); glow.addColorStop(0, `rgba(240,100,90,${0.34 * k})`); glow.addColorStop(1, 'rgba(240,100,90,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, 1080, 1920);
  const z = 1 + 0.006 * Math.max(0, t - T.shut); ctx.translate(540, 860); ctx.scale(z, z); ctx.translate(-540, -860);
  const rise = (t0, fn) => { const q = Math.min(1, sp(t - t0, { freq: 2.6, damp: 0.8 })); if (q <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, q * 1.5); ctx.translate(0, (1 - q) * 30); fn(); ctx.restore(); };
  rise(T.logo, () => { const w = 700, h = w * LOGO.height / LOGO.width; ctx.save(); ctx.globalCompositeOperation = 'lighten'; ctx.drawImage(LOGO, 540 - w / 2, 560 - h / 2, w, h); ctx.restore(); });
  rise(T.tag1, () => txt('You run the business.', 540, 880, '400 66px "Young Serif"', C.cream));
  rise(T.tag2, () => txt('We help it scale.', 540, 968, '400 66px "Young Serif"', C.coralLite));
  rise(T.serv, () => txt('Websites · Ads · AI receptionists', 540, 1100, '600 32px "Poppins"', C.coralLite));
  rise(T.url, () => txt('horizonscales.com', 540, 1174, '800 44px "Nunito"', C.cream));
  ctx.restore();
}

window.READY = false; window.DUR = DUR;
window.render = t => {
  t = Math.round(t * 1e5) / 1e5;
  ctx.save(); ctx.scale(SC, SC);
  ctx.fillStyle = '#BFE0F2'; ctx.fillRect(0, 0, 1080, 1920);
  if (t < T.shut) {
    const [fx, fy, z] = cam(t);
    ctx.save(); ctx.translate(540, 860); ctx.scale(z, z); ctx.translate(-fx, -fy);
    if (t < T.m) herScene(t, 'q');
    else if (t < T.s1) techScene(t, 'm');
    else if (t < T.s3) herScene(t, 's1');
    else if (t < T.bridge) herScene(t, 's3');
    else if (t < T.truth) bridgeScene(t);
    else if (t < T.fix1) techScene(t, 't');
    else if (t < T.fix2) techScene(t, 'f1');
    else if (t < T.pay) techScene(t, 'f2');
    else herScene(t, 'pay');
    ctx.restore();
    { const a = t >= T.pay - 0.35 && t < T.pay + 0.6 ? (t < T.pay ? (t - T.pay + 0.35) / 0.35 : 1 - (t - T.pay) / 0.6) : 0;
      if (a > 0) { ctx.fillStyle = `rgba(255,176,122,${0.55 * a})`; ctx.fillRect(0, 0, 1080, 1920); } }
    for (const c of CUTS) { const f = t >= c - 0.08 && t < c + 0.22 ? 1 - Math.abs(t - c) / 0.22 : 0; if (f > 0) { ctx.fillStyle = `rgba(255,244,224,${0.8 * Math.min(1, f)})`; ctx.fillRect(0, 0, 1080, 1920); } }
    const v = ctx.createRadialGradient(540, 860, 560, 540, 860, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.3)'); ctx.fillStyle = v; ctx.fillRect(0, 0, 1080, 1920);
    ctx.drawImage(TEX, 0, 0, 1080, 1920);
    title();
    for (const c of CUE) { const k = t >= c && t < c + 0.5 ? 1 - (t - c) / 0.5 : 0; if (k > 0) { ctx.fillStyle = `rgba(95,214,180,${0.28 * k})`; ctx.fillRect(0, 0, 1080, 1920); } }
    CAPS.forEach(cp => caption(cp, t));
  }
  if (t >= T.end) endCard(t);
  ctx.restore();
};
await loadFonts(['400 66px "Young Serif"', '800 44px "Nunito"', '600 60px "Fredoka"', '500 40px "Fredoka"', '600 32px "Poppins"']);
LOGO = await loadImage('assets/logo-long.png');
window.render(0); window.READY = true;
