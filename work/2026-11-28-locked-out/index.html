{ const g = TEX.getContext('2d'), r = rng(7);

// ───────────────────────── the cartoon person (bust). Origin = base of the neck; s = 1 → head 240 px wide.

  sad:       { b: 0.5, by: 0, ry: 26, m: 'frown' },

function toon(x, y, s, o) {
