<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Dead Number — Horizon Scales</title>
<style>

  @font-face { font-family: "Space Grotesk"; src: url(fonts/SpaceGrotesk-700.woff2) format("woff2"); font-weight: 700; }

  @font-face { font-family: "Poppins"; src: url(fonts/Poppins-600.woff2) format("woff2"); font-weight: 600; }

  html, body { margin: 0; background: #F4EEE2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { DUR, T, CAPS, TAPS, NUMBER } from './timeline.js';
import { seg, ease as E, spring, stageSize, setupCanvas, loadFonts, loadImage, rng, lerp, clamp, TAU } from './motion.js';

const { W: SW_, H: SH_ } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), SW_, SH_);
const SC = SW_ / 1080;
const MODE = new URLSearchParams(location.search).get('dir');
const C = { plum: 'rgb(28,2,40)', coral: '#F0645A', coralLite: '#F5A39A', cream: '#F6F0E6', sun: '#FFD27A' };
// risograph look: paper + three inks printed with multiply, so blue over yellow prints green
const PAPER = '#F4EEE2', BLUE = '#2F57A8', CORAL = '#F0645A', SUN = '#FFD27A', GREY = '#B9B2A6';
const sp = (x, o) => (x <= 0 ? 0 : spring(x, o));

// frame safety (Kai, Nov 5): hook panel at the top (y 176–396), the phone in the middle (x 270–730, y 440–1240),
// captions centred at x 500 around y 1340 (max 640 wide, so they stay left of x 860), nothing that matters right of
// x 864 below y 920 or under y 1630. Background shapes and grass only in the edges.

const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); };
const ink = (fn) => { ctx.save(); ctx.globalCompositeOperation = 'multiply'; fn(); ctx.restore(); };

// ── paper grain (seeded, drawn the same every frame)
const GRAIN = document.createElement('canvas'); GRAIN.width = 540; GRAIN.height = 960;
{ const g = GRAIN.getContext('2d'), im = g.createImageData(540, 960), r = rng(11);
  for (let i = 0; i < im.data.length; i += 4) { const v = 200 + r() * 55; im.data[i] = v; im.data[i + 1] = v - 4; im.data[i + 2] = v - 12; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }

// ── halftone disc: dots on a rotated grid, bigger toward the middle
function halftone(cx, cy, R, col, rot, step = 22) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.fillStyle = col; ctx.beginPath();
  for (let y = -R; y <= R; y += step) for (let x = -R; x <= R; x += step) {
    const d = Math.hypot(x, y) / R; if (d >= 1) continue; const r = step * 0.48 * (1 - d * d * 0.85);
    ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  }
  ctx.fill(); ctx.restore();
}
const BLADES = []; { const r = rng(3); for (let i = 0; i < 46; i++) BLADES.push([r() * 1120 - 20, 60 + r() * 150, r() * 6, r() < 0.5 ? BLUE : SUN, 14 + r() * 14]); }
function background(t) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, 1080, 1920);
  ink(() => {
    halftone(930 + 14 * Math.sin(t * 0.5), 250, 330, 'rgba(240,100,90,.55)', t * 0.06);
    halftone(120, 1640 + 18 * Math.sin(t * 0.4 + 1), 360, 'rgba(47,87,168,.32)', -t * 0.05, 26);
    halftone(140, 520, 150, 'rgba(255,210,122,.9)', t * 0.1, 18);
    for (const [x, h, ph, col, w] of BLADES) {                   // grass along the bottom edge, swaying
      const sw = Math.sin(t * 1.6 + ph) * 18, b = 1925;
      ctx.beginPath(); ctx.moveTo(x - w / 2, b); ctx.quadraticCurveTo(x + sw * 0.4, b - h * 0.6, x + sw, b - h); ctx.quadraticCurveTo(x + sw * 0.4 + 4, b - h * 0.5, x + w / 2, b); ctx.closePath();
      ctx.fillStyle = col === BLUE ? 'rgba(47,87,168,.75)' : SUN; ctx.fill();
    }
  });
}
function grain() { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.16; ctx.drawImage(GRAIN, 0, 0, 1080, 1920); ctx.restore(); }

// ── the phone
const PX = 270, PY = 440, PW = 460, PH = 800, SX = 292, SY = 474, SWd = 416, SHt = 740;
const NUM = [SX + SWd / 2, SY + 572];                    // the phone number on "your" site
const CALLB = [SX + 330, SY + 386];                      // the next landscaper's Call button
function phoneBody() {
  ink(() => { rr(PX + 12, PY + 14, PW, PH, 58); ctx.fillStyle = 'rgba(240,100,90,.85)'; ctx.fill(); });   // misregistered coral print
  rr(PX, PY, PW, PH, 58); ctx.fillStyle = PAPER; ctx.fill();
  ink(() => { rr(PX, PY, PW, PH, 58); ctx.lineWidth = 12; ctx.strokeStyle = BLUE; ctx.stroke(); rr(PX + 170, PY + 12, 120, 16, 8); ctx.fillStyle = BLUE; ctx.fill(); });
}
const S = (x, y) => [SX + x, SY + y];
function statusBar(dark) {
  ctx.font = '500 20px "DM Mono"'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = dark ? PAPER : BLUE;
  ctx.fillText('8:14', SX + 22, SY + 30); ctx.textAlign = 'right'; ctx.fillText('●●● ▮', SX + SWd - 22, SY + 30);
}
function siteScreen(t) {                                   // "your" website: looks fine, number is plain text
  statusBar(false);
  ink(() => { rr(SX + 18, SY + 44, SWd - 36, 40, 20); ctx.fillStyle = 'rgba(47,87,168,.14)'; ctx.fill(); });
  ctx.font = '500 19px "DM Mono"'; ctx.textAlign = 'center'; ctx.fillStyle = BLUE; ctx.fillText('your website', SX + SWd / 2, SY + 71);
  ink(() => { ctx.fillStyle = BLUE; ctx.fillRect(SX, SY + 96, SWd, 84); });
  ctx.font = '700 36px "Space Grotesk"'; ctx.fillStyle = PAPER; ctx.textAlign = 'left'; ctx.fillText('Your Landscaping', SX + 26, SY + 151);
  ink(() => { ctx.fillStyle = PAPER; for (let i = 0; i < 3; i++) ctx.fillRect(SX + SWd - 58, SY + 122 + i * 12, 34, 5); });
  // hero: a striped lawn (yellow under blue stripes prints green), a coral house, the sun
  const hy = SY + 180, hh = 250;
  ink(() => {
    ctx.fillStyle = 'rgba(255,210,122,.55)'; ctx.fillRect(SX, hy, SWd, hh);
    halftone(SX + 330, hy + 60, 54, 'rgba(240,100,90,.9)', t * 0.2, 10);
    ctx.fillStyle = SUN; ctx.fillRect(SX, hy + 140, SWd, hh - 140);
    for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? 'rgba(47,87,168,.55)' : 'rgba(47,87,168,.32)'; ctx.beginPath(); ctx.moveTo(SX + i * 60 - 40, hy + hh); ctx.lineTo(SX + i * 60 + 20, hy + hh); ctx.lineTo(SX + i * 40 + 70, hy + 140); ctx.lineTo(SX + i * 40 + 30, hy + 140); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = CORAL; ctx.fillRect(SX + 70, hy + 78, 120, 66); ctx.beginPath(); ctx.moveTo(SX + 58, hy + 82); ctx.lineTo(SX + 130, hy + 34); ctx.lineTo(SX + 202, hy + 82); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(47,87,168,.8)'; ctx.fillRect(SX + 116, hy + 104, 26, 40); ctx.fillRect(SX + 84, hy + 92, 22, 20);
  });
  ctx.textAlign = 'center';
  ctx.font = '700 32px "Space Grotesk"'; ctx.fillStyle = BLUE; ctx.fillText('Lawns · Patios · Cleanups', SX + SWd / 2, SY + 482);
  ctx.font = '500 24px "Space Grotesk"'; ctx.fillStyle = 'rgba(47,87,168,.75)'; ctx.fillText('Call us:', SX + SWd / 2, SY + 532);
  ctx.font = '500 40px "DM Mono"'; ctx.fillStyle = BLUE; ctx.fillText(NUMBER, NUM[0], NUM[1] + 14);
  ink(() => { for (let i = 0; i < 3; i++) { ctx.fillStyle = ['rgba(240,100,90,.45)', 'rgba(47,87,168,.3)', 'rgba(255,210,122,.9)'][i]; rr(SX + 22 + i * 130, SY + 628, 116, 96, 10); ctx.fill(); } });
}
function selection(t) {                                   // the long press: half the number selected, a Copy bubble
  if (t < T.press + 0.35 || t >= T.back) return;
  ctx.font = '500 40px "DM Mono"'; const w = ctx.measureText(NUMBER).width, x0 = NUM[0] - w / 2, cw = w / NUMBER.length;
  const k = E.outCubic(seg(t, T.press + 0.35, T.press + 0.6));
  ink(() => { ctx.fillStyle = 'rgba(240,100,90,.45)'; ctx.fillRect(x0 + 6 * cw - 2, NUM[1] - 22, 6 * cw * k, 48); });
  if (t < T.bubble) return;
  const q = Math.min(1, sp(t - T.bubble, { freq: 3.2, damp: 0.7 }));
  ctx.save(); ctx.translate(NUM[0] + 30, NUM[1] - 74); ctx.scale(q, q); ctx.globalAlpha = Math.min(1, q * 1.5);
  rr(-130, -32, 260, 60, 14); ctx.fillStyle = '#26264A'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-12, 28); ctx.lineTo(0, 42); ctx.lineTo(12, 28); ctx.fill();
  ctx.font = '500 26px "Space Grotesk"'; ctx.fillStyle = PAPER; ctx.textAlign = 'center'; ctx.fillText('Copy', -62, 8); ctx.fillText('Select all', 58, 8);
  ctx.fillStyle = 'rgba(244,238,226,.35)'; ctx.fillRect(-14, -18, 2, 36);
  ctx.restore();
}
function searchScreen(t) {                                 // the search list she goes back to
  statusBar(false);
  ink(() => { rr(SX + 18, SY + 48, SWd - 36, 60, 30); ctx.lineWidth = 4; ctx.strokeStyle = BLUE; ctx.stroke(); });
  ctx.font = '500 26px "Space Grotesk"'; ctx.textAlign = 'left'; ctx.fillStyle = BLUE; ctx.fillText('landscaper near me', SX + 70, SY + 87);
  ink(() => { circ(SX + 46, SY + 76, 10); ctx.lineWidth = 4; ctx.strokeStyle = CORAL; ctx.stroke(); });
  const card = (y, title, call) => {
    ink(() => { rr(SX + 18, y, SWd - 36, 172, 18); ctx.fillStyle = 'rgba(47,87,168,.08)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(47,87,168,.5)'; ctx.stroke(); });
    ctx.font = '700 28px "Space Grotesk"'; ctx.textAlign = 'left'; ctx.fillStyle = BLUE; ctx.fillText(title, SX + 40, y + 46);
    ink(() => { ctx.fillStyle = 'rgba(47,87,168,.28)'; rr(SX + 40, y + 66, 200, 12, 6); ctx.fill(); rr(SX + 40, y + 90, 150, 12, 6); ctx.fill(); });
    if (call) {
      const pr = t >= T.call && t < T.call + 0.25 ? 0.94 : 1;
      ctx.save(); ctx.translate(CALLB[0], CALLB[1]); ctx.scale(pr, pr);
      rr(-62, -30, 124, 60, 30); ctx.fillStyle = CORAL; ctx.fill();
      ctx.font = '700 28px "Space Grotesk"'; ctx.fillStyle = PAPER; ctx.textAlign = 'center'; ctx.fillText('Call', 12, 10);
      ctx.beginPath(); ctx.arc(-30, 0, 9, 0, TAU); ctx.fill();
      ctx.restore();
    } else { ink(() => { rr(SX + 40, y + 118, 120, 34, 17); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(47,87,168,.5)'; ctx.stroke(); }); ctx.font = '500 20px "DM Mono"'; ctx.fillStyle = BLUE; ctx.textAlign = 'center'; ctx.fillText('Website', SX + 100, y + 142); }
  };
  card(SY + 134, 'Your Landscaping', false);
  card(SY + 326, 'Next Landscaper', true);
  card(SY + 518, 'Third Landscaper', false);
}
function callScreen(t) {                                   // calling, then connected
  ink(() => { ctx.fillStyle = BLUE; ctx.fillRect(SX, SY, SWd, SHt); });
  statusBar(true);
  const cx = SX + SWd / 2, cy = SY + 330, on = t >= T.pick;
  ink(() => { for (let i = 0; i < 3; i++) { const k = ((t * 0.9 + i / 3) % 1); circ(cx, cy, 70 + 120 * k); ctx.lineWidth = 6; ctx.strokeStyle = `rgba(255,210,122,${(on ? 0.35 : 0.8) * (1 - k)})`; ctx.stroke(); } });
  circ(cx, cy, 70); ctx.fillStyle = SUN; ctx.fill();
  ctx.font = '700 54px "Space Grotesk"'; ctx.textAlign = 'center'; ctx.fillStyle = BLUE; ctx.fillText('NL', cx, cy + 19);
  ctx.font = '700 36px "Space Grotesk"'; ctx.fillStyle = PAPER; ctx.fillText('Next Landscaper', cx, SY + 150);
  ctx.font = '500 28px "DM Mono"'; ctx.fillStyle = on ? SUN : 'rgba(244,238,226,.8)';
  const dots = '.'.repeat(1 + (Math.floor(t * 3) % 3));
  ctx.fillText(on ? 'Connected  0:0' + Math.min(9, 1 + Math.floor(t - T.pick)) : 'Calling' + dots, cx, SY + 196);
  circ(cx, SY + 640, 46); ctx.fillStyle = CORAL; ctx.fill();
  ctx.save(); ctx.translate(cx, SY + 640); ctx.rotate(2.36); rr(-24, -9, 48, 18, 9); ctx.fillStyle = PAPER; ctx.fill(); ctx.restore();
}
function callSheet(t) {                                   // the tip: what a tap SHOULD do
  if (t < T.sheet) return;
  const q = Math.min(1.04, sp(t - T.sheet, { freq: 2.8, damp: 0.72 })), y = SY + SHt - 230 * Math.min(1, q);
  ctx.fillStyle = `rgba(38,38,74,${0.35 * Math.min(1, q)})`; ctx.fillRect(SX, SY, SWd, SHt);
  ctx.save(); rr(SX, SY, SWd, SHt, 40); ctx.clip();
  rr(SX + 10, y, SWd - 20, 220, 26); ctx.fillStyle = PAPER; ctx.fill();
  ink(() => { rr(SX + 10, y, SWd - 20, 220, 26); ctx.lineWidth = 4; ctx.strokeStyle = BLUE; ctx.stroke(); });
  ctx.font = '500 34px "DM Mono"'; ctx.textAlign = 'center'; ctx.fillStyle = BLUE; ctx.fillText(NUMBER, SX + SWd / 2, y + 62);
  const pulse = 1 + 0.04 * Math.sin((t - T.sheet) * 7);
  ctx.save(); ctx.translate(SX + SWd / 2, y + 138); ctx.scale(pulse, pulse);
  rr(-150, -38, 300, 76, 38); ctx.fillStyle = CORAL; ctx.fill();
  ctx.font = '700 36px "Space Grotesk"'; ctx.fillStyle = PAPER; ctx.fillText('Call', 14, 13); circ(-38, 0, 11); ctx.fill();
  ctx.restore(); ctx.restore();
}
function screen(t) {
  ctx.save(); rr(SX, SY, SWd, SHt, 40); ctx.clip();
  ctx.fillStyle = PAPER; ctx.fillRect(SX, SY, SWd, SHt);
  if (t < T.back) { siteScreen(t); selection(t); }
  else if (t < T.dial) {                                   // back gesture: site slides right, list comes in from the left
    const k = E.inOutCubic(seg(t, T.back, T.backDone));
    if (k < 1) { ctx.save(); ctx.translate(SWd * k, 0); siteScreen(t); ctx.restore(); }
    ctx.save(); ctx.translate(-SWd * 0.35 * (1 - k), 0); ctx.globalAlpha = 0.4 + 0.6 * k; searchScreen(t); ctx.restore();
  } else if (t < T.tip) {
    const k = E.outCubic(seg(t, T.dial, T.dialDone));
    if (k < 1) searchScreen(t);
    ctx.save(); ctx.translate(0, SHt * (1 - k)); callScreen(t); ctx.restore();
  } else { siteScreen(t); callSheet(t); }
  ctx.restore();
}

// ── the thumb (tip position over time; a coral riso print with a blue misregistration)
const TAP = [NUM[0] - 100, NUM[1] + 6];                // she taps on "(208)", so the rest of the number stays in view
const OFF = [330, 2200], NEAR = [TAP[0] - 40, TAP[1] + 130];
const KEYS = [
  [0, OFF], [1.25, OFF], [1.95, TAP], [2.6, [TAP[0] - 30, TAP[1] + 60]], [3.15, TAP], [3.45, [TAP[0] - 24, TAP[1] + 44]], [3.7, TAP],
  [3.95, TAP], [4.4, NEAR], [5.15, NEAR], [5.45, TAP], [6.9, TAP], [7.35, [SX + 14, SY + 420]], [7.9, [SX + 330, SY + 430]],
  [8.6, [SX + 330, SY + 520]], [9.42, CALLB], [9.7, CALLB], [10.3, OFF], [14.55, OFF], [15.2, TAP], [16.0, TAP], [16.6, OFF], [DUR, OFF],
];
function thumbAt(t) {
  for (let i = 0; i < KEYS.length - 1; i++) { const [a, pa] = KEYS[i], [b, pb] = KEYS[i + 1]; if (t < b) { const k = E.inOutCubic(seg(t, a, b)); return [lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k)]; } }
  return OFF;
}
function thumb(t) {
  const [x, y] = thumbAt(t); if (y > 2150) return;
  let press = 0; for (const k of TAPS) { const d = t - k; if (d >= -0.05 && d < 0.18) press = Math.max(press, 1 - Math.abs(d - 0.05) / 0.15); }
  if (t >= T.press && t < T.press + 1.4) press = Math.max(press, 0.8);
  const s = 1 - 0.06 * press;
  ctx.save(); ctx.translate(x, y); ctx.rotate(0.42); ctx.scale(s, s);
  ink(() => { rr(-50 - 8, -14 + 8, 100, 560, 50); ctx.fillStyle = 'rgba(47,87,168,.55)'; ctx.fill(); });
  rr(-50, -14, 100, 560, 50); ctx.fillStyle = '#F6B49A'; ctx.fill();
  ink(() => { rr(-50, -14, 100, 560, 50); ctx.fillStyle = 'rgba(240,100,90,.35)'; ctx.fill(); rr(-30, 6, 60, 78, 26); ctx.fillStyle = 'rgba(255,255,255,.0)'; ctx.fill(); });
  rr(-30, 6, 60, 76, 26); ctx.fillStyle = '#FBE3D8'; ctx.fill();
  ink(() => { ctx.strokeStyle = 'rgba(240,100,90,.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-26, 150); ctx.quadraticCurveTo(0, 160, 26, 150); ctx.stroke(); });
  ctx.restore();
}
function ripples(t) {
  for (const k of TAPS) {
    const d = t - k; if (d < 0 || d > 0.6) continue; const p = k === T.call ? CALLB : TAP;
    ink(() => { circ(p[0], p[1], 20 + 90 * E.outCubic(d / 0.6)); ctx.lineWidth = 8 * (1 - d / 0.6); ctx.strokeStyle = CORAL; ctx.stroke(); });
  }
}

// ── camera on the phone group: [focus x, focus y, zoom]
const BASE = [500, 840, 1];
function cam(t) {
  let z = 1, fx = 500, fy = 840;
  const inA = E.inOutCubic(seg(t, 1.2, 2.0)) * (1 - E.inOutCubic(seg(t, 6.9, 7.6)));
  z += 0.10 * inA;
  const inB = E.inOutCubic(seg(t, 8.8, 9.5)) * (1 - E.inOutCubic(seg(t, 9.75, 10.2)));
  z += 0.06 * inB; fx = lerp(fx, 560, inB); fy = lerp(fy, CALLB[1], inB);
  const inC = E.inOutCubic(seg(t, 14.6, 15.25));
  z += 0.10 * inC;
  let punch = 0; for (const k of [...TAPS, T.nothing, T.back, T.dial, T.pick, T.tip, T.ask]) if (t >= k) punch += 0.025 * Math.exp(-(t - k) * 8);
  z *= 1 + punch;
  let sx = 0; if (t >= T.nothing && t < T.nothing + 0.6) sx = 10 * Math.sin((t - T.nothing) * 40) * (1 - (t - T.nothing) / 0.6);
  const drift = 6 * Math.sin(t * 0.7);
  return [fx - sx, fy + drift * 0.3, z];
}

// ── overlays
function title() {
  ink(() => { ctx.fillStyle = 'rgba(240,100,90,.9)'; ctx.fillRect(152, 190, 800, 214); });
  ctx.fillStyle = BLUE; ctx.fillRect(140, 176, 800, 214);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '500 30px "DM Mono"'; ctx.letterSpacing = '6px'; ctx.fillStyle = SUN; ctx.fillText('LANDSCAPERS:', 543, 232); ctx.letterSpacing = '0px';
  ctx.font = '500 50px "Space Grotesk"'; ctx.fillStyle = PAPER; ctx.fillText('What happens when someone', 540, 300);
  ctx.font = '700 58px "Space Grotesk"'; ctx.fillStyle = SUN; ctx.fillText('taps your number?', 540, 368);
}
function caption(c, t) {
  if (t < c.t0 || t >= c.t1) return;
  const k = c.t0 === 0 ? 1 : Math.min(1.1, sp(t - c.t0, { freq: 3.2, damp: 0.66 })), out = 1 - seg(t, c.t1 - 0.1, c.t1);
  let fsz = 50; ctx.font = `500 ${fsz}px "Space Grotesk"`;
  if (ctx.measureText(c.text).width > 620) { fsz = Math.floor(50 * 620 / ctx.measureText(c.text).width); ctx.font = `500 ${fsz}px "Space Grotesk"`; }
  const i = c.text.indexOf(c.hi), pre = c.text.slice(0, i), post = c.text.slice(i + c.hi.length);
  const w0 = ctx.measureText(pre).width, w1 = ctx.measureText(c.hi).width, w2 = ctx.measureText(post).width, tw = w0 + w1 + w2, w = tw + 72, h = 104;
  ctx.save(); ctx.globalAlpha = out * Math.min(1, k * 2); ctx.translate(500, 1340 + (1 - Math.min(1, k)) * 22);
  ink(() => { ctx.fillStyle = 'rgba(240,100,90,.9)'; ctx.fillRect(-w / 2 + 10, -h / 2 + 10, w, h); });
  ctx.fillStyle = PAPER; ctx.fillRect(-w / 2, -h / 2, w, h);
  ink(() => { ctx.lineWidth = 5; ctx.strokeStyle = BLUE; ctx.strokeRect(-w / 2, -h / 2, w, h); });
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; let x = -tw / 2;
  ctx.fillStyle = BLUE; ctx.fillText(pre, x, fsz * 0.36); x += w0; ctx.fillStyle = '#D9473D'; ctx.fillText(c.hi, x, fsz * 0.36); x += w1; ctx.fillStyle = BLUE; ctx.fillText(post, x, fsz * 0.36);
  ctx.restore();
}

// ── end card: plum rises from the bottom
let LOGO;
function endCard(t) {
  const k = E.inOutCubic(seg(t, T.end, T.shut)), top = 1920 - 1960 * k;
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, 1080, 1960); ctx.clip();
  ctx.fillStyle = C.plum; ctx.fillRect(0, 0, 1080, 1920);
  ctx.fillStyle = C.coral; ctx.fillRect(0, top, 1080, 10);
  const glow = ctx.createRadialGradient(540, 640, 0, 540, 640, 780), ga = seg(t, T.end, T.shut); glow.addColorStop(0, `rgba(240,100,90,${0.32 * ga})`); glow.addColorStop(1, 'rgba(240,100,90,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, 1080, 1920);
  const z = 1 + 0.006 * Math.max(0, t - T.shut); ctx.translate(540, 860); ctx.scale(z, z); ctx.translate(-540, -860);

  rise(T.serv, () => { ctx.font = '600 32px "Poppins"'; ctx.fillStyle = C.coralLite; ctx.fillText('Websites · Ads · AI receptionists', 540, 1100); });
  rise(T.url, () => { ctx.font = '800 44px "Nunito"'; ctx.fillStyle = C.cream; ctx.fillText('horizonscales.com', 540, 1174); });
  ctx.restore();
}

window.READY = false; window.DUR = DUR;
window.render = t => {
  if (MODE === 'thumb') t = 0.3;
