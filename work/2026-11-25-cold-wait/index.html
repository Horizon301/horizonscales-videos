<script type="module">
import { DUR, T, CAPS, BUZZ, RINGS, CUTS, HITS, CUE } from './timeline.js';
import { seg, ease as E, spring, stageSize, setupCanvas, loadFonts, loadImage, rng, lerp, clamp, TAU } from './motion.js';

const { W: SW_, H: SH_ } = stageSize();

const INK = '#221530', AMBER = '#FFB84D', MINT = '#5FD6B4', RED = '#E5544A';
const sp = (x, o) => (x <= 0 ? 0 : spring(x, o));
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

const inAny = (t, wins) => wins.some(([a, b]) => t >= a && t < b);
const F = (w, px) => `${w} ${px}px "Fredoka"`; const F_ = F;

const TEX = document.createElement('canvas'); TEX.width = 540; TEX.height = 960;
{ const g = TEX.getContext('2d'), r = rng(7);
  for (let i = 0; i < 4200; i++) { g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '0,0,0'},${0.02 + r() * 0.04})`; g.fillRect(r() * 540, r() * 960, 1 + r() * 2, 1 + r() * 2); } }

// ───────────────────────── the cartoon person (bust). Origin = base of the neck; s = 1 → head 240 px wide.
const MOODS = {
  neutral:   { b: 0.05, by: 0, ry: 30, m: 'smile' },
  focused:   { b: -0.25, by: 4, ry: 24, m: 'flat' },
  worried:   { b: 0.4, by: -2, ry: 31, m: 'frownS' },
  annoyed:   { b: -0.42, by: 6, ry: 20, m: 'slant' },

  sad:       { b: 0.5, by: 0, ry: 26, m: 'frown' },

  circ(-118, 8, 24); ctx.fillStyle = o.skin; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke(); circ(118, 8, 24); ctx.fill(); ctx.stroke();

  for (const ex of [-44, 44]) {
    ctx.beginPath(); ctx.ellipse(ex, -6, 27, M.ry * blink, 0, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();

  else if (M.m === 'o') { ctx.ellipse(0, 62, 17, 23, 0, 0, TAU); ctx.fillStyle = '#5A1E26'; ctx.fill(); ctx.stroke(); }
  else { if (M.m === 'smile') ctx.arc(0, 40, 28, 0.25, Math.PI - 0.25); else if (M.m === 'flat') { ctx.moveTo(-22, 58); ctx.lineTo(22, 58); } else if (M.m === 'slant') { ctx.moveTo(-24, 62); ctx.lineTo(24, 52); } else if (M.m === 'frownS') ctx.arc(0, 78, 24, Math.PI + 0.45, -0.45); else ctx.arc(0, 88, 32, Math.PI + 0.35, -0.35); ctx.stroke(); }

  if (o.hat === 'cap') {
    ctx.beginPath(); ctx.arc(0, -34, 126, Math.PI, 0); ctx.closePath(); ctx.fillStyle = o.hatCol; ctx.fill(); ctx.stroke();
    rr(-140, -58, 280, 36, 18); ctx.fillStyle = o.hatCol2; ctx.fill(); ctx.stroke();
    circ(0, -104, 20); ctx.fillStyle = C.cream; ctx.fill();
  } else if (o.hat === 'bun') {
    ctx.beginPath(); ctx.moveTo(-121, -6); ctx.quadraticCurveTo(-112, -128, 0, -122); ctx.quadraticCurveTo(112, -128, 121, -6); ctx.quadraticCurveTo(70, -74, -20, -66); ctx.quadraticCurveTo(-90, -60, -121, -6); ctx.fillStyle = o.hair; ctx.fill(); ctx.stroke();
  }

    const h = side < 0 ? o.lh : o.rh; if (!h) continue;
    const sx = side * 172, sy = 98, ex = (sx + h[0]) / 2 + side * 58, ey = (sy + h[1]) / 2 + 46;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 76; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(h[0], h[1]); ctx.stroke();
    ctx.strokeStyle = o.sleeve || o.top; ctx.lineWidth = 62; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(h[0], h[1]); ctx.stroke();
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';

  }

}
const handPhone = (col = '#BFD7FF', rot = 0) => (hx, hy) => { ctx.save(); ctx.translate(hx, hy - 26); ctx.rotate(rot); rr(-34, -70, 68, 132, 14); ctx.fillStyle = '#0B0E1F'; ctx.fill(); rr(-26, -60, 52, 104, 8); ctx.fillStyle = col; ctx.fill(); ctx.restore(); };

function bigPhone(x, y, k, rot, draw, glow) {

  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 50; }

  rr(-34, -214, 68, 16, 8); ctx.fillStyle = '#0B0E1F'; ctx.fill();
  ctx.restore();
}
const slideIn = (t, t0) => lerp(1300, 712, Math.min(1, Math.min(1.04, sp(t - t0 + 0.02, { freq: 3, damp: 0.74 }))));
function avatar(y, col) { circ(0, y, 50); ctx.fillStyle = col; ctx.fill(); circ(0, y - 11, 17); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill(); ctx.beginPath(); ctx.arc(0, y + 40, 31, Math.PI, 0); ctx.fill(); }

function dots(t, y, col) { const ph = (t * 1.6) % 1; for (let i = 0; i < 3; i++) { circ(-40 + i * 40, y, 11); ctx.fillStyle = col; ctx.globalAlpha = 0.3 + 0.7 * Math.max(0, 1 - Math.abs(ph * 3 - i)); ctx.fill(); } ctx.globalAlpha = 1; }
function badge(q, y, col, s1, fs = 40) { ctx.save(); ctx.translate(0, y); ctx.scale(q, q); rr(-116, -46, 232, 92, 22); ctx.fillStyle = col; ctx.fill(); txt(s1, 0, fs * 0.36, F(600, fs), '#FFFFFF', 1); ctx.restore(); }

  bigPhone((t0 <= 0 ? 712 : slideIn(t, t0)) + shake, y + 5 * Math.sin(t * 1.5), 1.05, -0.03, draw, glow);
}
const pop = (t, t0) => Math.min(1.05, sp(t - t0, { freq: 3.3, damp: 0.62 }));
function stars(x, y, n, col) { ctx.fillStyle = col; for (let i = 0; i < 5; i++) { ctx.globalAlpha = i < n ? 1 : 0.25; ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 6.5 : 15; ctx.lineTo(x + i * 34 + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); } ctx.globalAlpha = 1; }

// ───────────────────────── HVAC tech
const TECH = { skin: '#C98B62', skin2: '#B07550', hair: '#2A1C16', top: '#3F5F7A', sleeve: '#3F5F7A', hat: 'cap', hatCol: '#2C8C9A', hatCol2: '#1F6B76', stubble: true };
const techDeco = () => { rr(-166, 112, 114, 112, 12); ctx.fillStyle = '#34506A'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); rr(60, 120, 110, 44, 10); ctx.fillStyle = C.cream; ctx.fill(); ctx.stroke(); txt('HVAC', 115, 154, F(600, 30), INK); };
function wrench(hx, hy, rot) { ctx.save(); ctx.translate(hx, hy); ctx.rotate(rot); rr(-11, -200, 22, 200, 8); ctx.fillStyle = '#9AA6B8'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -214, 38, 0.9, Math.PI * 2 + 0.25); ctx.lineTo(0, -214); ctx.closePath(); ctx.fillStyle = '#9AA6B8'; ctx.fill(); ctx.stroke(); ctx.restore(); }
// basement: concrete wall, a furnace and pipes, a work light that swings a little
function basement(t) {
  const g = ctx.createLinearGradient(0, 300, 0, 1500); g.addColorStop(0, '#5E6B7C'); g.addColorStop(1, '#2F3846'); ctx.fillStyle = g; ctx.fillRect(-300, -300, 1680, 2700);
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 6; for (let y = 520; y < 1500; y += 120) for (let x = -300 + ((y / 120) % 2) * 120; x < 1400; x += 240) { ctx.strokeRect(x, y, 240, 120); }
  const sw = Math.sin(t * 1.3) * 0.12; ctx.save(); ctx.translate(560, 300); ctx.rotate(sw);
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 210); ctx.stroke();
  const lg = ctx.createRadialGradient(0, 240, 10, 0, 420, 620); lg.addColorStop(0, 'rgba(255,228,160,.55)'); lg.addColorStop(1, 'rgba(255,228,160,0)'); ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(-40, 240); ctx.lineTo(-560, 1300); ctx.lineTo(560, 1300); ctx.lineTo(40, 240); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-46, 250); ctx.lineTo(-30, 210); ctx.lineTo(30, 210); ctx.lineTo(46, 250); ctx.closePath(); ctx.fillStyle = '#E6A23A'; ctx.fill(); ctx.stroke(); circ(0, 258, 16); ctx.fillStyle = '#FFF1C2'; ctx.fill(); ctx.restore();

  // furnace on the left
  rr(-120, 640, 300, 640, 12); ctx.fillStyle = '#D8DDE4'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
  for (let i = 0; i < 5; i++) { rr(-90, 680 + i * 30, 240, 12, 6); ctx.fillStyle = '#9AA3AE'; ctx.fill(); }
  rr(-60, 900, 180, 110, 14); ctx.fillStyle = '#3A1A10'; ctx.fill(); ctx.stroke();
  const fl = 0.75 + 0.25 * Math.sin(t * 13) * Math.sin(t * 7.3); ctx.fillStyle = `rgba(255,${130 + 60 * fl | 0},60,${fl})`; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-26 + i * 38, 984 - 18 * fl, 13, 30 * fl, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#3A4350'; ctx.fillRect(-300, 1280, 1680, 900);
}
function techScene(t, lt, mode) {
  basement(t);
  const working = mode === 'p2';
  const tap = working ? Math.abs(Math.sin(t * 5.5)) : 0.6;
  const mood = working ? 'focused' : 'happy';
  toon(420, 980, 1.32, { ...TECH, t, mood, look: working ? [-0.8, 0.6] : [0.8, 0.2], tilt: working ? -0.04 : 0.05, bob: Math.sin(t * 2.1) * 3,
    deco: techDeco, lh: working ? [-236, 150 - tap * 40] : [-250, 300], rh: working ? [200, 300] : [lerp(250, 196, 1), 110],
    lItem: working ? (hx, hy) => wrench(hx, hy, -0.5 - tap * 0.6) : null, rItem: working ? null : handPhone(MINT, 0.15) });
  const T0 = mode === 'p2' ? T.two : mode === 'f1' ? T.fix1 : T.fix2;

    txt('Missed call', -96, -12, F(600, 36), '#FFFFFF', 0, 'left'); txt('Homeowner', -96, 32, F(500, 30), '#AFC0F4', 0, 'left'); ctx.restore();
    if (t >= T0 + 1.2) { const k = pop(t, T0 + 1.2); ctx.save(); ctx.translate(0, 120); ctx.scale(k, k); rr(-116, -54, 232, 108, 22); ctx.fillStyle = RED; ctx.fill(); txt('No text', 0, -8, F(600, 38), '#FFFFFF'); txt('sent', 0, 34, F(600, 38), '#FFFFFF'); ctx.restore(); }

    ['Sorry I', 'missed you!', 'Calling back', 'in an hour.'].forEach((l, i) => txt(l, -94, -58 + i * 46, F(500, 36), '#FFFFFF', 0, 'left')); ctx.restore();

// next morning: his kitchen, coffee, he calls her back
function kitchen(t) {

  rr(600, 520, 340, 400, 12); const sg = ctx.createLinearGradient(0, 520, 0, 920); sg.addColorStop(0, '#9ED2F2'); sg.addColorStop(1, '#FFD9A8'); ctx.fillStyle = sg; ctx.fill(); ctx.lineWidth = 12; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();

const mug = (hx, hy) => { ctx.save(); ctx.translate(hx + 10, hy - 30); rr(-46, -60, 92, 110, 14); ctx.fillStyle = C.coral; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); ctx.beginPath(); ctx.arc(52, -6, 24, -1.2, 1.2); ctx.lineWidth = 12; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; for (let i = 0; i < 2; i++) { const ph = (ctx.__t * 0.8 + i * 0.5) % 1; ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(-14 + i * 26, -76 - ph * 60); ctx.quadraticCurveTo(-30 + i * 26, -100 - ph * 60, -12 + i * 26, -126 - ph * 60); ctx.stroke(); } ctx.globalAlpha = 1; ctx.lineCap = 'butt'; ctx.restore(); };
function morningScene(t) {

      const q = pop(t, T.three + 1.4); ctx.save(); ctx.translate(-4, 10); ctx.scale(q, q); rr(-112, -90, 224, 180, 28); ctx.fillStyle = '#E4E2EA'; ctx.fill();

// ───────────────────────── her cold living room
const HER = { skin: '#F0C3A0', skin2: '#D8A684', hair: '#8A3B22', top: '#D9A441', sleeve: '#D9A441', hat: 'bun' };

// mode: 'booked' (the question), 'vm' (reason 1), 'call' (fix 3), 'wait' (the ending)
function herScene(t, mode) {

// ───────────────────────── camera, overlays
function cam(t) {
  const starts = [0, T.one, T.two, T.three, T.bridge, T.fix1, T.fix2, T.fix3, T.pay, T.end]; let a = 0, b = T.end;

  let punch = 0; for (const k of HITS) if (t >= k) punch += 0.04 * Math.exp(-(t - k) * 8);

}
// the roadmap: three chips under the hook, the current one lit
function chips(t) {
  if (t < T.list) return;
  const P = [T.one, T.two, T.three], F = [T.fix1, T.fix2, T.fix3];
  for (let i = 0; i < 3; i++) {
    const q = Math.min(1.08, sp(t - T.list - i * 0.14, { freq: 3.4, damp: 0.6 })); if (q <= 0) continue;

    const problem = t >= P[i] && t < (i === 2 ? T.bridge : P[i + 1]);

    if (done || (fixing && t > F[i] + 0.4)) check(0, -4, 44, INK, 1); else txt(String(i + 1), 0, 21, F_(600, 60), INK);
    ctx.restore();

// the turn: the three problems on one card, each crossed out in red, while he says "here's how to fix all three"

function caption([t0, t1, raw], t) {

window.READY = false; window.DUR = DUR;
window.render = t => {

    ctx.restore();
    { const a = t >= T.pay - 0.35 && t < T.pay + 0.6 ? (t < T.pay ? (t - T.pay + 0.35) / 0.35 : 1 - (t - T.pay) / 0.6) : 0;
      if (a > 0) { ctx.fillStyle = `rgba(255,176,122,${0.55 * a})`; ctx.fillRect(0, 0, 1080, 1920); } }
    for (const c of CUTS) { const f = t >= c - 0.08 && t < c + 0.22 ? 1 - Math.abs(t - c) / 0.22 : 0; if (f > 0) { ctx.fillStyle = `rgba(255,244,224,${0.8 * Math.min(1, f)})`; ctx.fillRect(0, 0, 1080, 1920); } }
